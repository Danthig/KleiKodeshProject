name: Sync upstream and publish fork release

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: write

concurrency:
  group: sync-upstream-release
  cancel-in-progress: false

jobs:
  sync-build-release:
    runs-on: windows-latest

    steps:

      # ============================================================
      # 1. Checkout fork
      # ============================================================

      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true


      # ============================================================
      # 2. Configure upstream and determine latest release
      # ============================================================

      - name: Configure upstream remote
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "========================================"
          Write-Host "Configuring upstream repository"
          Write-Host "========================================"

          git remote add upstream https://github.com/KleiKodesh/KleiKodeshProject.git

          Write-Host "Checking latest upstream release..."

          $release = Invoke-RestMethod `
            -Uri "https://api.github.com/repos/KleiKodesh/KleiKodeshProject/releases/latest" `
            -Headers @{
              "User-Agent" = "KleiKodesh-ForkSync"
              "Authorization" = "Bearer $env:GITHUB_TOKEN"
              "Accept" = "application/vnd.github+json"
            }

          if ($release.tag_name -notmatch '^v\d+\.\d+\.\d+$') {
            throw "Invalid upstream release tag: $($release.tag_name)"
          }

          Write-Host ""
          Write-Host "Latest upstream release:"
          Write-Host $release.tag_name

          "UPSTREAM_RELEASE=$($release.tag_name)" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Encoding utf8

          Write-Host ""
          Write-Host "Fetching upstream release tag..."

          git fetch upstream `
            "refs/tags/$($release.tag_name):refs/tags/upstream-release"

          if ($LASTEXITCODE -ne 0) {
            throw "Failed to fetch upstream release tag."
          }

          Write-Host "[OK] Upstream release fetched."


      # ============================================================
      # 3. Merge upstream release into fork
      # ============================================================

      - name: Merge upstream changes
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "========================================"
          Write-Host "Merging upstream release"
          Write-Host "========================================"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          Write-Host "Merging upstream release $env:UPSTREAM_RELEASE..."

          git merge --no-edit upstream-release

          if ($LASTEXITCODE -ne 0) {
            git merge --abort

            Write-Host ""
            Write-Host "Merge conflict detected." -ForegroundColor Red
            Write-Host "The release will not be built." -ForegroundColor Red

            exit 1
          }

          Write-Host "[OK] Upstream merge completed."

          Write-Host ""
          Write-Host "Pushing merged master to fork..."

          git push origin HEAD:master

          if ($LASTEXITCODE -ne 0) {
            throw "Failed to push merged master to origin."
          }

          Write-Host "[OK] Fork master updated."


      # ============================================================
      # 4. Clone external ChromeTabs dependency
      #
      # KleiKodesh references:
      #
      #   ChromeTabs/FluentChromeTabs/FluentChromeTabs.csproj
      #
      # ChromeTabs is not a submodule.
      # The external repository is:
      #
      #   KleiKodesh/EasyTabs
      #
      # It must exist locally under the directory name ChromeTabs.
      # ============================================================
      - name: Clone external ChromeTabs dependency
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "========================================"
          Write-Host "Cloning ChromeTabs dependency"
          Write-Host "========================================"

          $chromeTabsPath = ".\ChromeTabs"

          if (Test-Path $chromeTabsPath) {
            Write-Host "Removing existing ChromeTabs directory..."

            Remove-Item `
              -Recurse `
              -Force `
              $chromeTabsPath
          }

          git clone `
            --depth 1 `
            https://github.com/KleiKodesh/EasyTabs.git `
            $chromeTabsPath

          if ($LASTEXITCODE -ne 0) {
            throw "Failed to clone KleiKodesh/EasyTabs."
          }

          $chromeTabsProject =
            ".\ChromeTabs\FluentChromeTabs\FluentChromeTabs.csproj"

          if (-not (Test-Path $chromeTabsProject)) {
            throw "FluentChromeTabs project was not found: $chromeTabsProject"
          }

          Write-Host ""
          Write-Host "[OK] ChromeTabs repository cloned."
          Write-Host "[OK] FluentChromeTabs.csproj found."
          Write-Host $chromeTabsProject


      # ============================================================
      # 5. Restore the external ChromeTabs project
      #
      # EasyTabs/FluentChromeTabs is an SDK-style .NET Framework 4.8
      # project. It is cloned during the workflow, so the regular
      # NuGet restore steps do not create its project.assets.json.
      # MSBuild later requires that file and otherwise fails with
      # NETSDK1004.
      # ============================================================
      - name: Restore ChromeTabs project
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "========================================"
          Write-Host "Restoring ChromeTabs project"
          Write-Host "========================================"

          $chromeTabsProject = ".\ChromeTabs\FluentChromeTabs\FluentChromeTabs.csproj"
          $assetsFile = ".\ChromeTabs\FluentChromeTabs\obj\project.assets.json"

          if (-not (Test-Path $chromeTabsProject)) {
            throw "ChromeTabs project was not found: $chromeTabsProject"
          }

          dotnet restore $chromeTabsProject --verbosity normal

          if ($LASTEXITCODE -ne 0) {
            throw "ChromeTabs restore failed."
          }

          if (-not (Test-Path $assetsFile)) {
            throw "ChromeTabs restore completed but project.assets.json was not created: $assetsFile"
          }

          Write-Host ""
          Write-Host "[OK] ChromeTabs NuGet restore completed."
          Write-Host "[OK] project.assets.json exists."


      # ============================================================
      # 6. Initialize and update submodules
      # ============================================================

      - name: Initialize submodules (latest remote HEAD)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "========================================"
          Write-Host "Synchronizing submodules"
          Write-Host "========================================"

          git submodule sync --recursive

          if ($LASTEXITCODE -ne 0) {
            throw "git submodule sync failed with exit code $LASTEXITCODE"
          }

          Write-Host "Updating submodules to latest remote commits..."

          git submodule update --init --recursive --remote

          if ($LASTEXITCODE -ne 0) {
            throw "git submodule update failed with exit code $LASTEXITCODE"
          }

          Write-Host "[OK] Submodules initialized and updated."


      # ============================================================
      # 7. Install NSIS
      # ============================================================

      - name: Install NSIS
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "========================================"
          Write-Host "Installing NSIS"
          Write-Host "========================================"

          choco install nsis -y --no-progress

          if ($LASTEXITCODE -ne 0) {
            throw "NSIS installation failed."
          }

          Write-Host "[OK] NSIS installed."


      # ============================================================
      # 8. Locate MSBuild
      # ============================================================

      - name: Locate MSBuild
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "========================================"
          Write-Host "Locating MSBuild"
          Write-Host "========================================"

          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"

          if (-not (Test-Path $vswhere)) {
            throw "vswhere.exe was not found at: $vswhere"
          }

          Write-Host "Searching for MSBuild with vswhere..."

          $msbuild = & $vswhere `
            -latest `
            -products * `
            -requires Microsoft.Component.MSBuild `
            -find "MSBuild\**\Bin\MSBuild.exe" |
            Select-Object -First 1

          if (-not $msbuild) {
            throw "MSBuild.exe was not found by vswhere."
          }

          $msbuild = $msbuild.Trim()

          if (-not (Test-Path $msbuild)) {
            throw "vswhere returned an invalid MSBuild path: $msbuild"
          }

          Write-Host ""
          Write-Host "MSBuild found:"
          Write-Host $msbuild

          "MSBUILD_PATH=$msbuild" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Encoding utf8 `
              -Append

          Write-Host "[OK] MSBuild configured."


      # ============================================================
      # 9. Install NuGet CLI
      # ============================================================

      - name: Install NuGet CLI
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "========================================"
          Write-Host "Installing NuGet CLI"
          Write-Host "========================================"

          choco install nuget.commandline -y --no-progress

          if ($LASTEXITCODE -ne 0) {
            throw "NuGet CLI installation failed."
          }

          $nuget = Get-Command nuget.exe -ErrorAction SilentlyContinue

          if (-not $nuget) {
            throw "NuGet CLI was not found after installation."
          }

          Write-Host ""
          Write-Host "NuGet found at:"
          Write-Host $nuget.Source

          Write-Host "[OK] NuGet CLI installed."


      # ============================================================
      # 10. Restore all NuGet packages
      # ============================================================

      - name: Restore NuGet packages
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          # --------------------------------------------------------
          # SDK-style WpfLib
          # --------------------------------------------------------

          Write-Host ""
          Write-Host "========================================"
          Write-Host "Restoring SDK-style projects"
          Write-Host "========================================"

          & $env:MSBUILD_PATH `
            "WpfLib\WpfLib.csproj" `
            /t:Restore `
            /p:Configuration=Release

          if ($LASTEXITCODE -ne 0) {
            throw "MSBuild restore failed for WpfLib.csproj with exit code $LASTEXITCODE"
          }

          if (-not (Test-Path ".\WpfLib\obj\project.assets.json")) {
            throw "WpfLib restore did not create project.assets.json"
          }

          Write-Host "[OK] WpfLib restore"


          # --------------------------------------------------------
          # DocumentLocator SDK project
          # --------------------------------------------------------

          Write-Host ""
          Write-Host "========================================"
          Write-Host "Restoring DocumentLocator SDK project"
          Write-Host "========================================"

          $documentLocatorProject = `
            "KitveiHakodesh\CSharpBackend\DocumentLocator\DocumentLocator\DocumentLocator.csproj"

          if (-not (Test-Path $documentLocatorProject)) {
            throw "DocumentLocator project not found: $documentLocatorProject"
          }

          & $env:MSBUILD_PATH `
            $documentLocatorProject `
            /t:Restore `
            /p:Configuration=Release `
            /p:Platform=AnyCPU

          if ($LASTEXITCODE -ne 0) {
            throw "MSBuild restore failed for DocumentLocator.csproj with exit code $LASTEXITCODE"
          }

          $documentLocatorAssets = `
            "KitveiHakodesh\CSharpBackend\DocumentLocator\DocumentLocator\obj\project.assets.json"

          if (-not (Test-Path $documentLocatorAssets)) {
            throw "DocumentLocator restore did not create project.assets.json"
          }

          Write-Host "[OK] DocumentLocator SDK project restore"


          # --------------------------------------------------------
          # Legacy packages.config projects
          # --------------------------------------------------------

          Write-Host ""
          Write-Host "========================================"
          Write-Host "Restoring legacy packages.config projects"
          Write-Host "========================================"

          $legacyRestores = @(
            @{
              Config = "KleiKodeshVsto\packages.config"
              Packages = ".\packages"
            },
            @{
              Config = "UpdateCheckerLib\packages.config"
              Packages = ".\packages"
            },
            @{
              Config = "KleiKodeshVsto\WebSitesLib\WebSitesLib\packages.config"
              Packages = ".\KleiKodeshVsto\WebSitesLib\packages"
            },
            @{
              Config = "KleiKodeshVsto\nakdan\Nakdan\packages.config"
              Packages = ".\KleiKodeshVsto\nakdan\packages"
            },
            @{
              Config = "KitveiHakodesh\CSharpBackend\KitveiHakodeshLib\packages.config"
              Packages = ".\KitveiHakodesh\CSharpBackend\packages"
            },
            @{
              Config = "KitveiHakodesh\CSharpBackend\KitveiHakodeshDemoApp\packages.config"
              Packages = ".\KitveiHakodesh\CSharpBackend\packages"
            },
            @{
              Config = "KitveiHakodesh\CSharpBackend\FtsLib-Csharp\FtsLib.Net48\packages.config"
              Packages = ".\KitveiHakodesh\CSharpBackend\FtsLib-Csharp\packages"
            },
            @{
              Config = "KitveiHakodesh\CSharpBackend\FtsLib-Csharp\FtsLibTest\packages.config"
              Packages = ".\KitveiHakodesh\CSharpBackend\FtsLib-Csharp\packages"
            },
            @{
              Config = "KleiKodeshVsto\DocDesign\DocDesignLib\packages.config"
              Packages = ".\KleiKodeshVsto\DocDesign\DocDesignLib\packages"
            },
            @{
              Config = "KleiKodeshVsto\Kiwix\KiwixLib\packages.config"
              Packages = ".\packages"
            },
            @{
              Config = "KleiKodeshVsto\RegexInWord\RegexFindLib\packages.config"
              Packages = ".\KleiKodeshVsto\RegexInWord\RegexFindLib\packages"
            },
            @{
              Config = "KitveiHakodesh\CSharpBackend\DocumentLocator\DocumentLocator\packages.config"
              Packages = ".\KitveiHakodesh\CSharpBackend\DocumentLocator\packages"
            },
            @{
              Config = "KitveiHakodesh\CSharpBackend\DocumentLocator\DocumentLocator.Service\packages.config"
              Packages = ".\KitveiHakodesh\CSharpBackend\DocumentLocator\packages"
            },
            @{
              Config = "KitveiHakodesh\CSharpBackend\DocumentLocator\DocumentLocator.Service\packages.config"
              Packages = ".\packages"
            }
          )

          foreach ($restore in $legacyRestores) {

            Write-Host ""
            Write-Host "----------------------------------------"
            Write-Host "Config:   $($restore.Config)"
            Write-Host "Packages: $($restore.Packages)"
            Write-Host "----------------------------------------"

            if (-not (Test-Path $restore.Config)) {
              throw "packages.config not found: $($restore.Config)"
            }

            New-Item `
              -ItemType Directory `
              -Force `
              -Path $restore.Packages |
              Out-Null

            & nuget.exe restore `
              $restore.Config `
              -PackagesDirectory $restore.Packages `
              -NonInteractive `
              -Verbosity normal

            if ($LASTEXITCODE -ne 0) {
              throw "NuGet restore failed for $($restore.Config) into $($restore.Packages) with exit code $LASTEXITCODE"
            }

            Write-Host "[OK] $($restore.Config) -> $($restore.Packages)"
          }


          # ========================================================
          # FIX:
          # Explicitly install System.ValueTuple 4.5.0
          #
          # DocumentLocator.Service expects this exact legacy DLL:
          #
          # packages\System.ValueTuple.4.5.0\lib\net47\
          #     System.ValueTuple.dll
          #
          # The current packages.config restore does not reliably
          # produce this package, so install it explicitly.
          # ========================================================

          Write-Host ""
          Write-Host "========================================"
          Write-Host "Installing legacy DocumentLocator System.ValueTuple 4.5.0"
          Write-Host "========================================"

          $documentLocatorPackages = `
            ".\KitveiHakodesh\CSharpBackend\DocumentLocator\packages"

          New-Item `
            -ItemType Directory `
            -Force `
            -Path $documentLocatorPackages |
            Out-Null

          & nuget.exe install `
            "System.ValueTuple" `
            -Version "4.5.0" `
            -OutputDirectory $documentLocatorPackages `
            -NonInteractive `
            -Verbosity normal

          if ($LASTEXITCODE -ne 0) {
            throw "Failed to install System.ValueTuple 4.5.0"
          }

          $legacyValueTuple = `
            "$documentLocatorPackages\System.ValueTuple.4.5.0\lib\net47\System.ValueTuple.dll"

          if (-not (Test-Path $legacyValueTuple)) {
            throw "System.ValueTuple 4.5.0 DLL was not installed: $legacyValueTuple"
          }

          Write-Host ""
          Write-Host "[OK] System.ValueTuple 4.5.0"
          Write-Host $legacyValueTuple


          # ========================================================
          # Legacy Unsafe dependency
          # ========================================================

          Write-Host ""
          Write-Host "========================================"
          Write-Host "Installing legacy DocumentLocator dependency"
          Write-Host "========================================"

          & nuget.exe install `
            "System.Runtime.CompilerServices.Unsafe" `
            -Version "4.3.0" `
            -OutputDirectory $documentLocatorPackages `
            -NonInteractive `
            -Verbosity normal

          if ($LASTEXITCODE -ne 0) {
            throw "Failed to install System.Runtime.CompilerServices.Unsafe 4.3.0"
          }

          $legacyUnsafe = `
            "$documentLocatorPackages\System.Runtime.CompilerServices.Unsafe.4.3.0\lib\netstandard1.0\System.Runtime.CompilerServices.Unsafe.dll"

          if (-not (Test-Path $legacyUnsafe)) {
            throw "Legacy Unsafe DLL was not installed: $legacyUnsafe"
          }

          Write-Host "[OK] System.Runtime.CompilerServices.Unsafe 4.3.0"


          # ========================================================
          # Verify required package files
          # ========================================================

          Write-Host ""
          Write-Host "========================================"
          Write-Host "Verifying required package files"
          Write-Host "========================================"

          $requiredFiles = @(

            # ------------------------------------------------------
            # ChromeTabs external dependency
            # ------------------------------------------------------

            ".\ChromeTabs\FluentChromeTabs\FluentChromeTabs.csproj",
            ".\ChromeTabs\FluentChromeTabs\obj\project.assets.json",

            # ------------------------------------------------------
            # Main solution packages
            # ------------------------------------------------------

            ".\packages\System.ValueTuple.4.6.1\build\net471\System.ValueTuple.targets",
            ".\packages\Microsoft.Web.WebView2.1.0.3912.50\build\Microsoft.Web.WebView2.targets",
            ".\packages\Stub.System.Data.SQLite.Core.NetFramework.1.0.119.0\build\net46\Stub.System.Data.SQLite.Core.NetFramework.targets",

            # ------------------------------------------------------
            # WebSitesLib
            # ------------------------------------------------------

            ".\KleiKodeshVsto\WebSitesLib\packages\System.ValueTuple.4.6.1\build\net471\System.ValueTuple.targets",

            # ------------------------------------------------------
            # Nakdan
            # ------------------------------------------------------

            ".\KleiKodeshVsto\nakdan\packages\System.ValueTuple.4.6.2\build\net471\System.ValueTuple.targets",

            # ------------------------------------------------------
            # KitveiHakodesh
            # ------------------------------------------------------

            ".\KitveiHakodesh\CSharpBackend\packages\System.ValueTuple.4.6.1\build\net471\System.ValueTuple.targets",

            ".\KitveiHakodesh\CSharpBackend\FtsLib-Csharp\packages\Stub.System.Data.SQLite.Core.NetFramework.1.0.119.0\build\net46\Stub.System.Data.SQLite.Core.NetFramework.targets",

            # ------------------------------------------------------
            # WpfLib
            # ------------------------------------------------------

            ".\WpfLib\obj\project.assets.json",

            # ------------------------------------------------------
            # DocumentLocator SDK restore
            # ------------------------------------------------------

            ".\KitveiHakodesh\CSharpBackend\DocumentLocator\DocumentLocator\obj\project.assets.json",

            # ------------------------------------------------------
            # DocumentLocator packages
            # ------------------------------------------------------

            ".\KitveiHakodesh\CSharpBackend\DocumentLocator\packages\J2N.2.0.0\lib\net45\J2N.dll",

            ".\KitveiHakodesh\CSharpBackend\DocumentLocator\packages\Lucene.Net.4.8.0-beta00016\lib\net45\Lucene.Net.dll",

            ".\KitveiHakodesh\CSharpBackend\DocumentLocator\packages\Microsoft.Bcl.AsyncInterfaces.10.0.5\lib\net462\Microsoft.Bcl.AsyncInterfaces.dll",

            ".\KitveiHakodesh\CSharpBackend\DocumentLocator\packages\System.Buffers.4.6.1\lib\net462\System.Buffers.dll",

            ".\KitveiHakodesh\CSharpBackend\DocumentLocator\packages\System.Memory.4.6.3\lib\net462\System.Memory.dll",

            ".\KitveiHakodesh\CSharpBackend\DocumentLocator\packages\System.Numerics.Vectors.4.6.1\lib\net462\System.Numerics.Vectors.dll",

            ".\KitveiHakodesh\CSharpBackend\DocumentLocator\packages\System.Runtime.CompilerServices.Unsafe.6.1.2\lib\net462\System.Runtime.CompilerServices.Unsafe.dll",

            ".\KitveiHakodesh\CSharpBackend\DocumentLocator\packages\System.Text.Encodings.Web.10.0.5\lib\net462\System.Text.Encodings.Web.dll",

            ".\KitveiHakodesh\CSharpBackend\DocumentLocator\packages\System.Text.Json.8.0.6\lib\net462\System.Text.Json.dll",

            ".\KitveiHakodesh\CSharpBackend\DocumentLocator\packages\System.Threading.Tasks.Extensions.4.6.3\lib\net462\System.Threading.Tasks.Extensions.dll",

            ".\KitveiHakodesh\CSharpBackend\DocumentLocator\packages\System.ValueTuple.4.6.1\build\net471\System.ValueTuple.targets",

            # ------------------------------------------------------
            # IMPORTANT:
            # Legacy System.ValueTuple 4.5.0 required by the
            # DocumentLocator.Service build.
            # ------------------------------------------------------

            ".\KitveiHakodesh\CSharpBackend\DocumentLocator\packages\System.ValueTuple.4.5.0\lib\net47\System.ValueTuple.dll",

            # ------------------------------------------------------
            # Legacy Unsafe
            # ------------------------------------------------------

            ".\KitveiHakodesh\CSharpBackend\DocumentLocator\packages\System.Runtime.CompilerServices.Unsafe.4.3.0\lib\netstandard1.0\System.Runtime.CompilerServices.Unsafe.dll",

            # ------------------------------------------------------
            # Other DocumentLocator dependencies
            # ------------------------------------------------------

            ".\KitveiHakodesh\CSharpBackend\DocumentLocator\packages\Prism.Core.7.2.0.1422\lib\net45\Prism.dll",

            ".\KitveiHakodesh\CSharpBackend\DocumentLocator\packages\Microsoft.Extensions.Configuration.Abstractions.1.1.2\lib\netstandard1.0\Microsoft.Extensions.Configuration.Abstractions.dll",

            ".\KitveiHakodesh\CSharpBackend\DocumentLocator\packages\Microsoft.Extensions.Primitives.1.1.1\lib\netstandard1.0\Microsoft.Extensions.Primitives.dll",

            # ------------------------------------------------------
            # Main packages - modern dependencies
            # ------------------------------------------------------

            ".\packages\Microsoft.Bcl.AsyncInterfaces.10.0.5\lib\net462\Microsoft.Bcl.AsyncInterfaces.dll",

            ".\packages\System.Buffers.4.6.1\lib\net462\System.Buffers.dll",

            ".\packages\System.IO.Pipelines.10.0.5\lib\net462\System.IO.Pipelines.dll",

            ".\packages\System.Memory.4.6.3\lib\net462\System.Memory.dll",

            ".\packages\System.Numerics.Vectors.4.6.1\lib\net462\System.Numerics.Vectors.dll",

            ".\packages\System.Runtime.CompilerServices.Unsafe.6.1.2\lib\net462\System.Runtime.CompilerServices.Unsafe.dll",

            ".\packages\System.Text.Encodings.Web.10.0.5\lib\net462\System.Text.Encodings.Web.dll",

            ".\packages\System.Text.Json.10.0.5\lib\net462\System.Text.Json.dll",

            ".\packages\System.Threading.Tasks.Extensions.4.6.3\lib\net462\System.Threading.Tasks.Extensions.dll"
          )

          foreach ($file in $requiredFiles) {

            if (-not (Test-Path $file)) {
              throw "Required restored file is missing: $file"
            }

            Write-Host "[OK] $file"
          }

          Write-Host ""
          Write-Host "========================================"
          Write-Host "NuGet restore completed successfully."
          Write-Host "========================================"


      # ============================================================
      # 11. Install vue-frontend npm dependencies
      #
      # KitveiHakodesh.targets runs `npm run build` (vue-tsc) during
      # the MSBuild build, but a fresh runner has no node_modules.
      # Without this step the build fails with:
      #
      #   'vue-tsc' is not recognized as an internal or external command
      # ============================================================
      - name: Install vue-frontend npm dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "========================================"
          Write-Host "Installing vue-frontend npm dependencies"
          Write-Host "========================================"

          $vueProjectDir = ".\KitveiHakodesh\vue-frontend"

          if (-not (Test-Path "$vueProjectDir\package.json")) {
            throw "vue-frontend package.json not found: $vueProjectDir"
          }

          Push-Location $vueProjectDir

          try {
            Write-Host ""
            Write-Host "Node: $(node --version)"
            Write-Host "npm:  $(npm --version)"

            npm ci

            if ($LASTEXITCODE -ne 0) {
              throw "npm ci failed with exit code $LASTEXITCODE"
            }

            if (-not (Test-Path ".\node_modules\vue-tsc")) {
              throw "vue-tsc was not installed by npm ci"
            }

            Write-Host ""
            Write-Host "[OK] vue-frontend npm dependencies installed."
          }
          finally {
            Pop-Location
          }


      # ============================================================
      # 12. Import build signing certificate
      #
      # KleiKodeshVsto.csproj signs its ClickOnce manifests
      # (SignManifests=true) using the certificate identified by
      # ManifestCertificateThumbprint. That certificate (and the
      # gitignored *.pfx key file) exists only on the local build
      # machine, so without this step MSBuild fails with MSB3323:
      #
      #   Unable to find manifest signing certificate in the
      #   certificate store.
      #
      # The certificate + private key are stored in the
      # BUILD_SIGNING_PFX_B64 / BUILD_SIGNING_PFX_PASSWORD
      # repository secrets and are re-imported on every run.
      # ============================================================
      - name: Import build signing certificate
        shell: pwsh
        env:
          PFX_B64: ${{ secrets.BUILD_SIGNING_PFX_B64 }}
          PFX_PASSWORD: ${{ secrets.BUILD_SIGNING_PFX_PASSWORD }}
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "========================================"
          Write-Host "Importing build signing certificate"
          Write-Host "========================================"

          $expectedThumbprint = "9222AB03C319646619DABBAAFA3CC033EEFD42E0"
          $runnerPfx = Join-Path $env:RUNNER_TEMP "KleiKodesh_TemporaryKey.pfx"
          $projectPfx = ".\KleiKodeshVsto\KleiKodesh_TemporaryKey.pfx"

          if ([string]::IsNullOrWhiteSpace($env:PFX_B64)) {
            throw "Secret BUILD_SIGNING_PFX_B64 is empty or missing."
          }

          if ([string]::IsNullOrWhiteSpace($env:PFX_PASSWORD)) {
            throw "Secret BUILD_SIGNING_PFX_PASSWORD is empty or missing."
          }

          [IO.File]::WriteAllBytes($runnerPfx, [Convert]::FromBase64String($env:PFX_B64))

          $securePwd = ConvertTo-SecureString $env:PFX_PASSWORD -AsPlainText -Force

          $imported = Import-PfxCertificate `
            -FilePath $runnerPfx `
            -Password $securePwd `
            -CertStoreLocation "Cert:\CurrentUser\My"

          if ($imported.Thumbprint -ne $expectedThumbprint) {
            throw "Imported certificate thumbprint $($imported.Thumbprint) does not match expected $expectedThumbprint."
          }

          # Also place the key file where the project expects it
          # (ManifestKeyFile=KleiKodesh_TemporaryKey.pfx, gitignored).
          Copy-Item $runnerPfx $projectPfx -Force

          Write-Host ""
          Write-Host "[OK] Certificate imported: $($imported.Subject)"
          Write-Host "[OK] Thumbprint: $($imported.Thumbprint)"
          Write-Host "[OK] Expires: $($imported.NotAfter)"
          Write-Host "[OK] Key file written: $projectPfx"


      # ============================================================
      # 13. Install VSTO Runtime
      #
      # The VSTO build task VerifyClickOnceSigningSettings
      # (Microsoft.VisualStudio.Tools.Office.targets line 162)
      # requires Microsoft.VisualStudio.Tools.Applications.Hosting
      # 10.0.0.0 from the "Visual Studio Tools for Office Runtime",
      # which is not installed on the hosted runner. Without it the
      # build fails with MSB4018 / FileNotFoundException for
      # Microsoft.VisualStudio.Tools.Applications.Hosting.
      #
      # vstor_redist.exe = official Microsoft download of the
      # "Microsoft Visual Studio 2010 Tools for Office Runtime"
      # (fwlink 158917). Silent install; exit code 3010 means
      # success with reboot pending (safe to ignore in CI).
      # ============================================================
      - name: Install VSTO Runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "========================================"
          Write-Host "Installing VSTO Runtime (vstor_redist)"
          Write-Host "========================================"

          $setup = Join-Path $env:RUNNER_TEMP "vstor_redist.exe"
          $url = "https://go.microsoft.com/fwlink/?LinkId=158917"

          Invoke-WebRequest -Uri $url -OutFile $setup -UseBasicParsing

          if (-not (Test-Path $setup)) {
            throw "vstor_redist.exe download failed."
          }

          Write-Host "Downloaded: $((Get-Item $setup).Length) bytes"

          $proc = Start-Process -FilePath $setup -ArgumentList "/q", "/norestart" -Wait -PassThru
          $code = $proc.ExitCode

          if ($code -ne 0 -and $code -ne 3010) {
            throw "vstor_redist.exe failed with exit code $code."
          }

          $gacProbe = @(
            (Join-Path $env:WINDIR "Microsoft.NET\assembly\GAC_MSIL\Microsoft.VisualStudio.Tools.Applications.Hosting"),
            (Join-Path $env:WINDIR "assembly\GAC_MSIL\Microsoft.VisualStudio.Tools.Applications.Hosting")
          )

          $found = $gacProbe | Where-Object { Test-Path $_ } | Select-Object -First 1

          if ($found) {
            Write-Host "[OK] Hosting assembly present in GAC: $found"
          }
          else {
            Write-Warning "Hosting assembly not found in expected GAC paths; continuing."
          }

          Write-Host "[OK] VSTO Runtime installed (exit code $code)."


      # ============================================================
      # 14. Build installer
      # ============================================================

      - name: Build installer
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "========================================"
          Write-Host "Building KleiKodesh installer"
          Write-Host "========================================"

          .\Build\scripts\build-installer.ps1 `
            -ManualVersion $env:UPSTREAM_RELEASE `
            -NoRelease `
            -ReleaseNotesSource commits

          if ($LASTEXITCODE -ne 0) {
            throw "Installer build failed with exit code $LASTEXITCODE"
          }

          Write-Host ""
          Write-Host "[OK] Installer build completed."


      # ============================================================
      # 15. Publish GitHub release
      # ============================================================

      - name: Publish fork release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"

          $version = $env:UPSTREAM_RELEASE
          $releaseDir = "Build/releases"

          Write-Host "========================================"
          Write-Host "Preparing release $version"
          Write-Host "========================================"

          $assets = @(
            "$releaseDir/KleiKodeshSetup-$version.exe",
            "$releaseDir/KleiKodeshSetup-$version-x64.exe",
            "$releaseDir/KleiKodeshSetup-$version-x86.exe",
            "$releaseDir/KitveiHakodeshPortable-$version.zip"
          )

          foreach ($asset in $assets) {

            if (-not (Test-Path $asset)) {
              throw "Missing release asset: $asset"
            }

            Write-Host "[OK] Found asset: $asset"
          }


          # --------------------------------------------------------
          # Check whether release already exists
          # --------------------------------------------------------

          Write-Host ""
          Write-Host "Checking whether release $version already exists..."

          gh release view `
            $version `
            --repo "${{ github.repository }}"

          if ($LASTEXITCODE -eq 0) {

            Write-Host ""
            Write-Host "Existing release found. Deleting it..."

            gh release delete `
              $version `
              --repo "${{ github.repository }}" `
              --yes `
              --cleanup-tag

            if ($LASTEXITCODE -ne 0) {
              throw "Failed to delete existing release $version"
            }

          }
          else {

            Write-Host "No existing release found."
          }


          # --------------------------------------------------------
          # Create release
          # --------------------------------------------------------

          Write-Host ""
          Write-Host "Creating release $version..."

          gh release create `
            $version `
            $assets `
            --repo "${{ github.repository }}" `
            --title "KleiKodesh $version" `
            --generate-notes `
            --target master

          if ($LASTEXITCODE -ne 0) {
            throw "Failed to create GitHub release $version"
          }

          Write-Host ""
          Write-Host "========================================"
          Write-Host "Release $version published successfully."
          Write-Host "========================================"
