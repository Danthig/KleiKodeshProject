name: Sync upstream and publish fork release

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: write

concurrency:
  group: sync-upstream-release
  cancel-in-progress: false

jobs:
  sync-build-release:
    runs-on: windows-2025

    steps:

      # ============================================================
      # 1. Checkout fork
      # ============================================================
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true


      # ============================================================
      # 2. Configure upstream and determine latest upstream release
      # ============================================================
      - name: Configure upstream remote
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "========================================"
          Write-Host "Configuring upstream repository"
          Write-Host "========================================"

          git remote remove upstream 2>$null
          git remote add upstream https://github.com/KleiKodesh/KleiKodeshProject.git

          $release = Invoke-RestMethod `
            -Uri "https://api.github.com/repos/KleiKodesh/KleiKodeshProject/releases/latest" `
            -Headers @{
              "User-Agent" = "KleiKodesh-ForkSync"
              "Authorization" = "Bearer $env:GITHUB_TOKEN"
              "Accept" = "application/vnd.github+json"
            }

          if (-not $release.tag_name) {
            throw "Could not determine latest upstream release."
          }

          if ($release.tag_name -notmatch '^v\d+\.\d+\.\d+$') {
            throw "Invalid upstream release tag: $($release.tag_name)"
          }

          $version = $release.tag_name

          Write-Host ""
          Write-Host "Latest upstream release: $version"
          Write-Host ""

          "UPSTREAM_RELEASE=$version" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          # IMPORTANT:
          # Fetch the release tag into FETCH_HEAD.
          # Do NOT try to resolve refs/tags/$version locally afterward.
          git fetch upstream "refs/tags/$version"

          if ($LASTEXITCODE -ne 0) {
            throw "Failed to fetch upstream release $version."
          }

          Write-Host ""
          Write-Host "[OK] Upstream release $version fetched into FETCH_HEAD."


      # ============================================================
      # 3. Merge upstream release
      #
      # The fetched release is deliberately merged from FETCH_HEAD.
      # This avoids the local-tag/ref problem that caused the previous
      # workflow failure.
      # ============================================================
      - name: Merge upstream changes
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "========================================"
          Write-Host "Merging upstream release"
          Write-Host "========================================"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git merge --no-edit FETCH_HEAD

          if ($LASTEXITCODE -ne 0) {
            Write-Host ""
            Write-Host "========================================"
            Write-Host "UPSTREAM MERGE FAILED"
            Write-Host "========================================"
            Write-Host ""
            Write-Host "The fork and upstream have merge conflicts."
            Write-Host "Git status:"
            git status --short
            Write-Host ""
            Write-Host "Merge conflict files:"
            git diff --name-only --diff-filter=U

            git merge --abort

            exit 1
          }

          Write-Host ""
          Write-Host "[OK] Upstream release merged successfully."


      # ============================================================
      # 4. Clone external ChromeTabs dependency
      #
      # KleiKodesh references:
      #
      #   ChromeTabs/FluentChromeTabs/FluentChromeTabs.csproj
      #
      # ChromeTabs is not a submodule.
      # The external repository is:
      #
      #   KleiKodesh/EasyTabs
      #
      # It must exist locally under the directory name ChromeTabs.
      # ============================================================
      - name: Clone external ChromeTabs dependency
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "========================================"
          Write-Host "Cloning ChromeTabs dependency"
          Write-Host "========================================"

          $chromeTabsPath = ".\ChromeTabs"

          if (Test-Path $chromeTabsPath) {
            Write-Host "Removing existing ChromeTabs directory..."

            Remove-Item `
              -Recurse `
              -Force `
              $chromeTabsPath
          }

          git clone `
            --depth 1 `
            https://github.com/KleiKodesh/EasyTabs.git `
            $chromeTabsPath

          if ($LASTEXITCODE -ne 0) {
            throw "Failed to clone KleiKodesh/EasyTabs."
          }

          $chromeTabsProject =
            ".\ChromeTabs\FluentChromeTabs\FluentChromeTabs.csproj"

          if (-not (Test-Path $chromeTabsProject)) {
            throw "FluentChromeTabs project was not found: $chromeTabsProject"
          }

          Write-Host ""
          Write-Host "[OK] ChromeTabs repository cloned."
          Write-Host "[OK] FluentChromeTabs.csproj found."
          Write-Host $chromeTabsProject


      # ============================================================
      # 5. Initialize Git submodules
      # ============================================================
      - name: Initialize submodules
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "========================================"
          Write-Host "Initializing submodules"
          Write-Host "========================================"

          git submodule sync --recursive

          if ($LASTEXITCODE -ne 0) {
            throw "git submodule sync failed."
          }

          git submodule update --init --recursive --remote

          if ($LASTEXITCODE -ne 0) {
            throw "git submodule update failed."
          }

          Write-Host ""
          Write-Host "[OK] Submodules initialized."


      # ============================================================
      # 6. Install NSIS
      # ============================================================
      - name: Install NSIS
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "========================================"
          Write-Host "Installing NSIS"
          Write-Host "========================================"

          choco install nsis -y --no-progress

          if ($LASTEXITCODE -ne 0) {
            throw "NSIS installation failed."
          }

          Write-Host "[OK] NSIS installed."


      # ============================================================
      # 7. Locate MSBuild
      # ============================================================
      - name: Locate MSBuild
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "========================================"
          Write-Host "Locating MSBuild"
          Write-Host "========================================"

          $vswhere =
            "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"

          if (-not (Test-Path $vswhere)) {
            throw "vswhere.exe was not found: $vswhere"
          }

          $msbuild = & $vswhere `
            -latest `
            -products * `
            -requires Microsoft.Component.MSBuild `
            -find "MSBuild\**\Bin\MSBuild.exe" |
            Select-Object -First 1

          if (-not $msbuild) {
            throw "MSBuild.exe was not found by vswhere."
          }

          $msbuild = $msbuild.Trim()

          Write-Host ""
          Write-Host "MSBuild:"
          Write-Host $msbuild

          "MSBUILD_PATH=$msbuild" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append


      # ============================================================
      # 8. Install NuGet CLI
      # ============================================================
      - name: Install NuGet CLI
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "========================================"
          Write-Host "Installing NuGet CLI"
          Write-Host "========================================"

          choco install nuget.commandline -y --no-progress

          if ($LASTEXITCODE -ne 0) {
            throw "NuGet CLI installation failed."
          }

          $nuget = Get-Command nuget.exe -ErrorAction SilentlyContinue

          if (-not $nuget) {
            throw "NuGet CLI was not found after installation."
          }

          Write-Host ""
          Write-Host "[OK] NuGet CLI available:"
          Write-Host $nuget.Source


      # ============================================================
      # 9. Restore NuGet packages
      # ============================================================
      - name: Restore NuGet packages
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "========================================"
          Write-Host "Restoring NuGet packages"
          Write-Host "========================================"


          # --------------------------------------------------------
          # SDK-style projects
          # --------------------------------------------------------

          Write-Host ""
          Write-Host "Restoring WpfLib..."

          if (Test-Path "WpfLib\WpfLib.csproj") {
            & $env:MSBUILD_PATH `
              "WpfLib\WpfLib.csproj" `
              /t:Restore `
              /p:Configuration=Release

            if ($LASTEXITCODE -ne 0) {
              throw "WpfLib restore failed."
            }
          }


          Write-Host ""
          Write-Host "Restoring DocumentLocator..."

          $documentLocatorProject =
            "KitveiHakodesh\CSharpBackend\DocumentLocator\DocumentLocator\DocumentLocator.csproj"

          if (Test-Path $documentLocatorProject) {
            & $env:MSBUILD_PATH `
              $documentLocatorProject `
              /t:Restore `
              /p:Configuration=Release `
              /p:Platform=AnyCPU

            if ($LASTEXITCODE -ne 0) {
              throw "DocumentLocator restore failed."
            }
          }


          # --------------------------------------------------------
          # Legacy packages.config projects
          # --------------------------------------------------------

          $legacyRestores = @(
            @{
              Config   = "KleiKodeshVsto\packages.config"
              Packages = ".\packages"
            },
            @{
              Config   = "UpdateCheckerLib\packages.config"
              Packages = ".\packages"
            },
            @{
              Config   = "KleiKodeshVsto\WebSitesLib\WebSitesLib\packages.config"
              Packages = ".\KleiKodeshVsto\WebSitesLib\packages"
            },
            @{
              Config   = "KleiKodeshVsto\nakdan\Nakdan\packages.config"
              Packages = ".\KleiKodeshVsto\nakdan\packages"
            },
            @{
              Config   = "KitveiHakodesh\CSharpBackend\KitveiHakodeshLib\packages.config"
              Packages = ".\KitveiHakodesh\CSharpBackend\packages"
            },
            @{
              Config   = "KitveiHakodesh\CSharpBackend\KitveiHakodeshDemoApp\packages.config"
              Packages = ".\KitveiHakodesh\CSharpBackend\packages"
            },
            @{
              Config   = "KitveiHakodesh\CSharpBackend\FtsLib-Csharp\FtsLib.Net48\packages.config"
              Packages = ".\KitveiHakodesh\CSharpBackend\FtsLib-Csharp\packages"
            },
            @{
              Config   = "KitveiHakodesh\CSharpBackend\FtsLib-Csharp\FtsLibTest\packages.config"
              Packages = ".\KitveiHakodesh\CSharpBackend\FtsLib-Csharp\packages"
            },
            @{
              Config   = "KleiKodeshVsto\DocDesign\DocDesignLib\packages.config"
              Packages = ".\KleiKodeshVsto\DocDesign\DocDesignLib\packages"
            },
            @{
              Config   = "KleiKodeshVsto\Kiwix\KiwixLib\packages.config"
              Packages = ".\packages"
            },
            @{
              Config   = "KleiKodeshVsto\RegexInWord\RegexFindLib\packages.config"
              Packages = ".\KleiKodeshVsto\RegexInWord\packages"
            },
            @{
              Config   = "KitveiHakodesh\CSharpBackend\DocumentLocator\DocumentLocator\packages.config"
              Packages = ".\KitveiHakodesh\CSharpBackend\DocumentLocator\packages"
            },
            @{
              Config   = "KitveiHakodesh\CSharpBackend\DocumentLocator\DocumentLocator.Service\packages.config"
              Packages = ".\KitveiHakodesh\CSharpBackend\DocumentLocator\packages"
            }
          )

          foreach ($restore in $legacyRestores) {

            Write-Host ""
            Write-Host "Restoring:"
            Write-Host $restore.Config

            if (-not (Test-Path $restore.Config)) {
              Write-Host "[SKIP] packages.config does not exist."
              continue
            }

            New-Item `
              -ItemType Directory `
              -Force `
              -Path $restore.Packages |
              Out-Null

            & nuget.exe restore `
              $restore.Config `
              -PackagesDirectory $restore.Packages `
              -NonInteractive `
              -Verbosity normal

            if ($LASTEXITCODE -ne 0) {
              throw "NuGet restore failed for $($restore.Config)"
            }
          }


          # --------------------------------------------------------
          # Explicit System.ValueTuple 4.5.0
          # --------------------------------------------------------

          Write-Host ""
          Write-Host "Installing System.ValueTuple 4.5.0..."

          $documentLocatorPackages =
            ".\KitveiHakodesh\CSharpBackend\DocumentLocator\packages"

          New-Item `
            -ItemType Directory `
            -Force `
            -Path $documentLocatorPackages |
            Out-Null

          & nuget.exe install `
            "System.ValueTuple" `
            -Version "4.5.0" `
            -OutputDirectory $documentLocatorPackages `
            -NonInteractive `
            -Verbosity normal

          if ($LASTEXITCODE -ne 0) {
            throw "Failed to install System.ValueTuple 4.5.0."
          }

          $legacyValueTuple =
            "$documentLocatorPackages\System.ValueTuple.4.5.0\lib\net47\System.ValueTuple.dll"

          if (-not (Test-Path $legacyValueTuple)) {
            throw "System.ValueTuple 4.5.0 DLL was not installed: $legacyValueTuple"
          }

          Write-Host "[OK] System.ValueTuple.dll found."


          # --------------------------------------------------------
          # Explicit Unsafe package
          # --------------------------------------------------------

          Write-Host ""
          Write-Host "Installing System.Runtime.CompilerServices.Unsafe 4.3.0..."

          & nuget.exe install `
            "System.Runtime.CompilerServices.Unsafe" `
            -Version "4.3.0" `
            -OutputDirectory $documentLocatorPackages `
            -NonInteractive `
            -Verbosity normal

          if ($LASTEXITCODE -ne 0) {
            throw "Failed to install System.Runtime.CompilerServices.Unsafe 4.3.0."
          }

          Write-Host ""
          Write-Host "========================================"
          Write-Host "NuGet restore completed successfully"
          Write-Host "========================================"


      # ============================================================
      # 10. Verify build dependencies
      # ============================================================
      - name: Verify build dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "========================================"
          Write-Host "Verifying build dependencies"
          Write-Host "========================================"

          $requiredFiles = @(
            ".\ChromeTabs\FluentChromeTabs\FluentChromeTabs.csproj",
            ".\KitveiHakodesh\CSharpBackend\DocumentLocator\packages\System.ValueTuple.4.5.0\lib\net47\System.ValueTuple.dll"
          )

          foreach ($file in $requiredFiles) {

            if (-not (Test-Path $file)) {
              throw "Required build dependency is missing: $file"
            }

            Write-Host "[OK] $file"
          }

          Write-Host ""
          Write-Host "========================================"
          Write-Host "Dependency verification completed"
          Write-Host "========================================"


      # ============================================================
      # 11. Build installer
      # ============================================================
      - name: Build installer
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "========================================"
          Write-Host "Building KleiKodesh installer"
          Write-Host "========================================"

          .\Build\scripts\build-installer.ps1 `
            -ManualVersion $env:UPSTREAM_RELEASE `
            -NoRelease `
            -ReleaseNotesSource commits

          if ($LASTEXITCODE -ne 0) {
            throw "Installer build failed with exit code $LASTEXITCODE"
          }

          Write-Host ""
          Write-Host "========================================"
          Write-Host "Installer build completed"
          Write-Host "========================================"


      # ============================================================
      # 12. Verify release assets
      # ============================================================
      - name: Verify release assets
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "========================================"
          Write-Host "Verifying release assets"
          Write-Host "========================================"

          $version = $env:UPSTREAM_RELEASE
          $releaseDir = "Build/releases"

          $assets = @(
            "$releaseDir/KleiKodeshSetup-$version.exe",
            "$releaseDir/KleiKodeshSetup-$version-x64.exe",
            "$releaseDir/KleiKodeshSetup-$version-x86.exe",
            "$releaseDir/KitveiHakodeshPortable-$version.zip"
          )

          foreach ($asset in $assets) {

            if (-not (Test-Path $asset)) {
              throw "Missing release asset: $asset"
            }

            $size = (Get-Item $asset).Length

            Write-Host "[OK] $asset"
            Write-Host "     Size: $size bytes"
          }

          Write-Host ""
          Write-Host "========================================"
          Write-Host "All release assets verified"
          Write-Host "========================================"


      # ============================================================
      # 13. Push merged master ONLY after successful build
      # ============================================================
      - name: Push merged master
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "========================================"
          Write-Host "Pushing successful upstream merge"
          Write-Host "========================================"

          git push origin HEAD:master

          if ($LASTEXITCODE -ne 0) {
            throw "Failed to push merged master branch."
          }

          Write-Host ""
          Write-Host "[OK] Merged master pushed to fork."


      # ============================================================
      # 14. Publish GitHub release
      # ============================================================
      - name: Publish fork release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "========================================"
          Write-Host "Publishing GitHub release"
          Write-Host "========================================"

          $version = $env:UPSTREAM_RELEASE
          $releaseDir = "Build/releases"

          $assets = @(
            "$releaseDir/KleiKodeshSetup-$version.exe",
            "$releaseDir/KleiKodeshSetup-$version-x64.exe",
            "$releaseDir/KleiKodeshSetup-$version-x86.exe",
            "$releaseDir/KitveiHakodeshPortable-$version.zip"
          )

          # --------------------------------------------------------
          # Check whether release already exists
          # --------------------------------------------------------

          gh release view `
            $version `
            --repo "${{ github.repository }}"

          if ($LASTEXITCODE -eq 0) {

            Write-Host ""
            Write-Host "Release $version already exists."
            Write-Host "Deleting existing release and tag..."

            gh release delete `
              $version `
              --repo "${{ github.repository }}" `
              --yes `
              --cleanup-tag

            if ($LASTEXITCODE -ne 0) {
              throw "Failed to delete existing release $version."
            }
          }


          # --------------------------------------------------------
          # Create release
          # --------------------------------------------------------

          gh release create `
            $version `
            $assets `
            --repo "${{ github.repository }}" `
            --title "KleiKodesh $version" `
            --generate-notes `
            --target master

          if ($LASTEXITCODE -ne 0) {
            throw "Failed to create GitHub release $version."
          }

          Write-Host ""
          Write-Host "========================================"
          Write-Host "Release $version published successfully"
          Write-Host "========================================"
