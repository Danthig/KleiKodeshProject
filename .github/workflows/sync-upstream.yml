name: Sync upstream and publish fork release

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: write

concurrency:
  group: sync-upstream-release
  cancel-in-progress: false

jobs:
  sync-build-release:
    runs-on: windows-latest

    steps:

      # ============================================================
      # 1. Checkout fork
      # ============================================================

      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true


      # ============================================================
      # 2. Configure upstream and determine latest release
      # ============================================================

      - name: Determine latest upstream release and skip already processed versions
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "========================================"
          Write-Host "Checking upstream release and fork sync state"
          Write-Host "========================================"

          git remote remove upstream 2>$null
          git remote add upstream https://github.com/KleiKodesh/KleiKodeshProject.git

          git fetch upstream "+refs/tags/*:refs/upstream/tags/*" --force
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to fetch upstream tags."
          }

          git fetch origin "+refs/tags/*:refs/fork/tags/*" --force
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to fetch fork tags."
          }

          $release = Invoke-RestMethod `
            -Uri "https://api.github.com/repos/KleiKodesh/KleiKodeshProject/releases/latest" `
            -Headers @{
              "User-Agent" = "KleiKodesh-ForkSync"
              "Authorization" = "Bearer $env:GITHUB_TOKEN"
              "Accept" = "application/vnd.github+json"
            }

          if ($null -eq $release -or [string]::IsNullOrWhiteSpace($release.tag_name)) {
            throw "Upstream releases API did not return a tag_name."
          }

          if ($release.tag_name -notmatch '^v\d+\.\d+\.\d+$') {
            throw "Invalid upstream release tag: $($release.tag_name)"
          }

          $upstreamTag = $release.tag_name

          Write-Host ""
          Write-Host "Latest upstream release:"
          Write-Host $upstreamTag

          "UPSTREAM_RELEASE=$upstreamTag" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Encoding utf8

          Write-Host ""
          Write-Host "Fetching exact upstream tag into a dedicated ref..."

          git fetch upstream "refs/tags/${upstreamTag}:refs/upstream/tags/${upstreamTag}" --force
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to fetch upstream release tag $upstreamTag."
          }

          $releaseCommit = (git rev-parse "refs/upstream/tags/$upstreamTag^{commit}").Trim()
          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($releaseCommit)) {
            throw "Could not resolve upstream release tag $upstreamTag to a commit."
          }

          $submodulePath = "KitveiHakodesh/CSharpBackend/DocumentLocator"
          $submoduleEntry = git ls-tree $releaseCommit -- $submodulePath
          if ($LASTEXITCODE -ne 0 -or $submoduleEntry -notmatch '^160000 commit ([0-9a-f]{40})\s') {
            throw "Upstream release $upstreamTag does not contain the expected DocumentLocator submodule gitlink."
          }

          $upstreamDocumentLocatorSha = $Matches[1]
          "UPSTREAM_DOCUMENTLOCATOR_SHA=$upstreamDocumentLocatorSha" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          $alreadyReleased = $false
          $releaseUri = "https://api.github.com/repos/${{ github.repository }}/releases/tags/$upstreamTag"
          try {
            $forkRelease = Invoke-RestMethod `
              -Uri $releaseUri `
              -Headers @{
                "User-Agent" = "KleiKodesh-ForkSync"
                "Authorization" = "Bearer $env:GITHUB_TOKEN"
                "Accept" = "application/vnd.github+json"
              }
            $alreadyReleased = $true
          }
          catch {
            $statusCode = 0
            if ($null -ne $_.Exception.Response) {
              $statusCode = [int]$_.Exception.Response.StatusCode
            }

            if ($statusCode -ne 404) {
              throw "Could not determine whether fork release $upstreamTag exists: $($_.Exception.Message)"
            }
          }

          if ($alreadyReleased) {
            if ($forkRelease.tag_name -ne $upstreamTag) {
              throw "The fork release API returned tag $($forkRelease.tag_name) for requested release $upstreamTag."
            }

            $publishedCommit = git rev-parse --verify --quiet "refs/fork/tags/$upstreamTag^{commit}"
            if ($LASTEXITCODE -ne 0) {
              throw "Fork release $upstreamTag exists, but its tag does not resolve locally. Refusing to mark it complete."
            }

            $publishedCommit = $publishedCommit.Trim()
            $publishedGitlink = git ls-tree $publishedCommit -- $submodulePath
            if ($publishedGitlink -notmatch "^160000 commit $upstreamDocumentLocatorSha\s") {
              throw "Fork release $upstreamTag does not point to the upstream release's exact DocumentLocator gitlink."
            }

            git merge-base --is-ancestor "refs/upstream/tags/$upstreamTag" $publishedCommit
            if ($LASTEXITCODE -ne 0) {
              throw "Fork release $upstreamTag does not contain the exact upstream release commit."
            }

            Write-Host ""
            Write-Host "GitHub release $upstreamTag is verified at $publishedCommit. Nothing to do."
            exit 0
          }

          $forkTagCommit = git rev-parse --verify --quiet "refs/fork/tags/$upstreamTag^{commit}" 2>$null
          if ($LASTEXITCODE -eq 0) {
            $forkTagCommit = $forkTagCommit.Trim()
            $forkMasterCommit = (git rev-parse refs/remotes/origin/master).Trim()

            git merge-base --is-ancestor $forkTagCommit $forkMasterCommit
            if ($LASTEXITCODE -ne 0) {
              throw "Fork tag $upstreamTag points to $forkTagCommit, which is not in origin/master history. Refusing to reuse or move the tag."
            }

            $forkTagSubmoduleEntry = git ls-tree $forkTagCommit -- $submodulePath
            if ($forkTagSubmoduleEntry -notmatch "^160000 commit $upstreamDocumentLocatorSha\s") {
              throw "Fork tag $upstreamTag points to a tree whose DocumentLocator gitlink does not match upstream release $upstreamTag ($upstreamDocumentLocatorSha). Refusing to rebuild or republish this tag."
            }

            git merge-base --is-ancestor "refs/upstream/tags/$upstreamTag" $forkTagCommit
            if ($LASTEXITCODE -ne 0) {
              throw "Fork tag $upstreamTag does not contain upstream release commit $releaseCommit."
            }

            "FORK_EXISTING_RELEASE_TAG_COMMIT=$forkTagCommit" |
              Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          }
          else {
            "FORK_EXISTING_RELEASE_TAG_COMMIT=" |
              Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          }

          Write-Host "[OK] Upstream release $upstreamTag and its exact DocumentLocator gitlink are verified."


      # ============================================================
      # 3. Merge upstream release into fork
      # ============================================================

      - name: Merge upstream release into fork while preserving custom history
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "========================================"
          Write-Host "Merging upstream release into fork"
          Write-Host "========================================"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          $syncBranch = "sync/$env:UPSTREAM_RELEASE"
          $submodulePath = "KitveiHakodesh/CSharpBackend/DocumentLocator"
          $patchSource = "Build/patches/DocumentLocator-fork-dependency-paths.patch"
          $patchForBuild = Join-Path $env:RUNNER_TEMP "DocumentLocator-fork-dependency-paths.patch"

          if (-not (Test-Path $patchSource)) {
            throw "Fork-specific DocumentLocator build patch is missing: $patchSource"
          }

          Copy-Item $patchSource $patchForBuild -Force

          Write-Host "Creating synchronized working branch from fork master..."
          git checkout -B $syncBranch origin/master

          if ($LASTEXITCODE -ne 0) {
            throw "Failed to create working branch $syncBranch from origin/master."
          }

          $mergeAlreadyApplied = $false
            git merge-base --is-ancestor "refs/upstream/tags/$env:UPSTREAM_RELEASE" HEAD
          if ($LASTEXITCODE -eq 0) {
            $mergeAlreadyApplied = $true
          }

          if ($mergeAlreadyApplied) {
            Write-Host "The exact upstream release is already in origin/master. Continuing with dependency verification and build."
          }
          else {
            Write-Host "Merging exact upstream release $env:UPSTREAM_RELEASE into the fork history..."
            git merge --no-ff --no-edit "refs/upstream/tags/$env:UPSTREAM_RELEASE"
            $mergeExitCode = $LASTEXITCODE

            if ($mergeExitCode -ne 0) {
              $conflicts = git diff --name-only --diff-filter=U
              Write-Host "Merge conflicts detected in:" -ForegroundColor Red
              $conflicts | ForEach-Object { Write-Host " - $_" -ForegroundColor Red }
              git merge --abort

              throw "Merge of upstream release $env:UPSTREAM_RELEASE failed with exit code $mergeExitCode. No conflict resolution was attempted."
            }

            Write-Host "[OK] Upstream merge completed on working branch $syncBranch."
          }

          Write-Host "Verifying the release-pinned DocumentLocator gitlink..."
          $gitlinkLine = git ls-tree HEAD -- $submodulePath
          if ($LASTEXITCODE -ne 0 -or $gitlinkLine -notmatch '^160000 commit ([0-9a-f]{40})\s') {
            throw "The synchronized tree does not contain a valid DocumentLocator gitlink."
          }

          $currentGitlinkSha = $Matches[1]
          if ($currentGitlinkSha -ne $env:UPSTREAM_DOCUMENTLOCATOR_SHA) {
            Write-Host "Updating the fork gitlink from $currentGitlinkSha to the exact upstream release commit $env:UPSTREAM_DOCUMENTLOCATOR_SHA."
            git update-index --cacheinfo "160000,$env:UPSTREAM_DOCUMENTLOCATOR_SHA,$submodulePath"

            if ($LASTEXITCODE -ne 0) {
              throw "Failed to stage the release-pinned DocumentLocator gitlink."
            }
          }

          git submodule update --init --recursive --checkout --force -- $submodulePath
          $submoduleUpdateExitCode = $LASTEXITCODE
          if ($submoduleUpdateExitCode -ne 0) {
            throw "Could not fetch exact DocumentLocator commit $env:UPSTREAM_DOCUMENTLOCATOR_SHA (exit code $submoduleUpdateExitCode). No remote HEAD fallback is permitted."
          }

          $resolvedGitlinkSha = (git -C $submodulePath rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $resolvedGitlinkSha -ne $env:UPSTREAM_DOCUMENTLOCATOR_SHA) {
            throw "DocumentLocator resolved to $resolvedGitlinkSha instead of the release-pinned commit $env:UPSTREAM_DOCUMENTLOCATOR_SHA."
          }

          git add -- $submodulePath
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to stage the resolved DocumentLocator gitlink."
          }

          git diff --cached --quiet -- $submodulePath
          $gitlinkDiffExitCode = $LASTEXITCODE
          if ($gitlinkDiffExitCode -eq 1) {
            git commit -m "Pin DocumentLocator to upstream $env:UPSTREAM_RELEASE"
            if ($LASTEXITCODE -ne 0) {
              throw "Failed to commit the verified release-pinned DocumentLocator gitlink."
            }
          }
          elseif ($gitlinkDiffExitCode -ne 0) {
            throw "Could not verify the staged DocumentLocator gitlink (exit code $gitlinkDiffExitCode)."
          }

          if (-not [string]::IsNullOrWhiteSpace($env:FORK_EXISTING_RELEASE_TAG_COMMIT)) {
            $tagTree = (git rev-parse "$env:FORK_EXISTING_RELEASE_TAG_COMMIT^{tree}").Trim()
            $buildTree = (git rev-parse "HEAD^{tree}").Trim()
            if ($LASTEXITCODE -ne 0 -or $tagTree -ne $buildTree) {
              throw "Existing tag $env:UPSTREAM_RELEASE does not point to the exact synchronized tree being built. Refusing to reuse or move the tag."
            }
          }

          Write-Host ""
          Write-Host "Local merge tree and exact dependencies are ready for build."


      # ============================================================
      # 4. Clone external ChromeTabs dependency
      #
      # KleiKodesh references:
      #
      #   ChromeTabs/FluentChromeTabs/FluentChromeTabs.csproj
      #
      # ChromeTabs is not a submodule.
      # The external repository is:
      #
      #   KleiKodesh/EasyTabs
      #
      # It must exist locally under the directory name ChromeTabs.
      # ============================================================
      - name: Clone external ChromeTabs dependency
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "========================================"
          Write-Host "Cloning ChromeTabs dependency"
          Write-Host "========================================"

          $chromeTabsPath = ".\ChromeTabs"
          $chromeTabsCommit = "749a706ecaa1a6ac3c71bb187b996590ccb96386"

          if (Test-Path $chromeTabsPath) {
            Write-Host "Removing existing ChromeTabs directory..."

            Remove-Item `
              -Recurse `
              -Force `
              $chromeTabsPath
          }

          git clone `
            --no-checkout `
            https://github.com/KleiKodesh/EasyTabs.git `
            $chromeTabsPath

          if ($LASTEXITCODE -ne 0) {
            throw "Failed to clone KleiKodesh/EasyTabs."
          }

          git -C $chromeTabsPath checkout --detach $chromeTabsCommit
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to check out pinned EasyTabs commit $chromeTabsCommit."
          }

          $resolvedChromeTabsCommit = (git -C $chromeTabsPath rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $resolvedChromeTabsCommit -ne $chromeTabsCommit) {
            throw "EasyTabs resolved to $resolvedChromeTabsCommit instead of pinned commit $chromeTabsCommit."
          }

          $chromeTabsProject =
            ".\ChromeTabs\FluentChromeTabs\FluentChromeTabs.csproj"

          if (-not (Test-Path $chromeTabsProject)) {
            throw "FluentChromeTabs project was not found: $chromeTabsProject"
          }

          Write-Host ""
          Write-Host "[OK] ChromeTabs repository cloned."
          Write-Host "[OK] EasyTabs pinned commit: $resolvedChromeTabsCommit"
          Write-Host "[OK] FluentChromeTabs.csproj found."
          Write-Host $chromeTabsProject


      # ============================================================
      # 5. Restore the external ChromeTabs project
      #
      # EasyTabs/FluentChromeTabs is an SDK-style .NET Framework 4.8
      # project. It is cloned during the workflow, so the regular
      # NuGet restore steps do not create its project.assets.json.
      # MSBuild later requires that file and otherwise fails with
      # NETSDK1004.
      # ============================================================
      - name: Restore ChromeTabs project
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "========================================"
          Write-Host "Restoring ChromeTabs project"
          Write-Host "========================================"

          $chromeTabsProject = ".\ChromeTabs\FluentChromeTabs\FluentChromeTabs.csproj"
          $assetsFile = ".\ChromeTabs\FluentChromeTabs\obj\project.assets.json"

          if (-not (Test-Path $chromeTabsProject)) {
            throw "ChromeTabs project was not found: $chromeTabsProject"
          }

          dotnet restore $chromeTabsProject --verbosity normal

          if ($LASTEXITCODE -ne 0) {
            throw "ChromeTabs restore failed."
          }

          if (-not (Test-Path $assetsFile)) {
            throw "ChromeTabs restore completed but project.assets.json was not created: $assetsFile"
          }

          Write-Host ""
          Write-Host "[OK] ChromeTabs NuGet restore completed."
          Write-Host "[OK] project.assets.json exists."


      # ============================================================
      # 6. Verify release-pinned submodules
      # ============================================================

      - name: Verify submodules against exact release gitlinks
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "========================================"
          Write-Host "Synchronizing submodules to the exact gitlinks in the synced tree"
          Write-Host "========================================"

          git submodule sync --recursive

          if ($LASTEXITCODE -ne 0) {
            throw "git submodule sync failed with exit code $LASTEXITCODE"
          }

          Write-Host "Checking out each submodule at the commit recorded in the merged tree..."

          git submodule update --init --recursive --checkout --force
          $submoduleUpdateExitCode = $LASTEXITCODE

          if ($submoduleUpdateExitCode -ne 0) {
            Write-Host ""
            Write-Host "Submodule resolution failed while checking out the exact gitlink commits from the synchronized tree." -ForegroundColor Red
            Write-Host "This means one or more submodule commits are not available from their configured remotes." -ForegroundColor Red
            Write-Host "The workflow is stopping before build or release publication to avoid publishing a partially synchronized tree." -ForegroundColor Red
            Write-Host ""
            git submodule status --recursive 2>$null | ForEach-Object { Write-Host $_ }
            throw "git submodule update failed with exit code $submoduleUpdateExitCode"
          }

          $submoduleStatus = git submodule status --recursive

          foreach ($line in $submoduleStatus) {
            if ($line.StartsWith("+") -or $line.StartsWith("-")) {
              throw "Submodule mismatch detected in workspace: $line. The tree is not synchronized to the exact recorded gitlink commit."
            }
          }

          Write-Host "[OK] Submodules match the exact gitlink commit state from the synchronized tree."
          $submoduleStatus | ForEach-Object { Write-Host $_ }

          $documentLocatorPath = "KitveiHakodesh/CSharpBackend/DocumentLocator"
          $documentLocatorCommit = (git -C $documentLocatorPath rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $documentLocatorCommit -ne $env:UPSTREAM_DOCUMENTLOCATOR_SHA) {
            throw "DocumentLocator resolved to $documentLocatorCommit instead of release-pinned commit $env:UPSTREAM_DOCUMENTLOCATOR_SHA."
          }

          $patchForBuild = Join-Path $env:RUNNER_TEMP "DocumentLocator-fork-dependency-paths.patch"
          if (-not (Test-Path $patchForBuild)) {
            throw "Fork-specific DocumentLocator build patch is missing: $patchForBuild"
          }

          git -C $documentLocatorPath apply --check --unidiff-zero $patchForBuild
          if ($LASTEXITCODE -ne 0) {
            throw "Fork-specific DocumentLocator patch does not apply to release commit $documentLocatorCommit."
          }

          git -C $documentLocatorPath apply --unidiff-zero $patchForBuild
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to apply the fork-specific DocumentLocator build patch."
          }

          $patchedProject = Get-Content "$documentLocatorPath\DocumentLocator.Service\DocumentLocator.Service.csproj" -Raw
          if ($patchedProject -notmatch [regex]::Escape("System.Runtime.CompilerServices.Unsafe.6.1.2\lib\net462\System.Runtime.CompilerServices.Unsafe.dll") -or
              $patchedProject -notmatch [regex]::Escape("System.ValueTuple.4.6.1\lib\net47\System.ValueTuple.dll")) {
            throw "The fork-specific DocumentLocator dependency paths were not applied to the build source."
          }

          Write-Host "[OK] Fork-specific DocumentLocator dependency paths are applied to the build source."


      # ============================================================
      # 7. Install NSIS
      # ============================================================

      - name: Install NSIS
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "========================================"
          Write-Host "Installing NSIS"
          Write-Host "========================================"

          choco install nsis --version=3.12.0 -y --no-progress

          if ($LASTEXITCODE -ne 0) {
            throw "NSIS installation failed."
          }

          Write-Host "[OK] NSIS installed."


      # ============================================================
      # 8. Locate MSBuild
      # ============================================================

      - name: Locate MSBuild
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "========================================"
          Write-Host "Locating MSBuild"
          Write-Host "========================================"

          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"

          if (-not (Test-Path $vswhere)) {
            throw "vswhere.exe was not found at: $vswhere"
          }

          Write-Host "Searching for MSBuild with vswhere..."

          $msbuild = & $vswhere `
            -latest `
            -products * `
            -requires Microsoft.Component.MSBuild `
            -find "MSBuild\**\Bin\MSBuild.exe" |
            Select-Object -First 1

          if (-not $msbuild) {
            throw "MSBuild.exe was not found by vswhere."
          }

          $msbuild = $msbuild.Trim()

          if (-not (Test-Path $msbuild)) {
            throw "vswhere returned an invalid MSBuild path: $msbuild"
          }

          Write-Host ""
          Write-Host "MSBuild found:"
          Write-Host $msbuild

          "MSBUILD_PATH=$msbuild" |
            Out-File `
              -FilePath $env:GITHUB_ENV `
              -Encoding utf8 `
              -Append

          # Also expose MSBuild on PATH for later steps: Find-MSBuild in
          # Build\scripts\build-helpers.ps1 resolves msbuild via
          # Get-Command first, and its hardcoded candidate list does not
          # cover VS18\Enterprise (the hosted runner's edition) — which
          # otherwise breaks the KitveiHakodeshDemoApp build.
          Split-Path -Path $msbuild |
            Out-File `
              -FilePath $env:GITHUB_PATH `
              -Encoding utf8 `
              -Append

          Write-Host "[OK] MSBuild configured."


      # ============================================================
      # 9. Install NuGet CLI
      # ============================================================

      - name: Install NuGet CLI
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "========================================"
          Write-Host "Installing NuGet CLI"
          Write-Host "========================================"

          choco install nuget.commandline --version=7.9.0 -y --no-progress

          if ($LASTEXITCODE -ne 0) {
            throw "NuGet CLI installation failed."
          }

          $nuget = Get-Command nuget.exe -ErrorAction SilentlyContinue

          if (-not $nuget) {
            throw "NuGet CLI was not found after installation."
          }

          Write-Host ""
          Write-Host "NuGet found at:"
          Write-Host $nuget.Source

          Write-Host "[OK] NuGet CLI installed."


      # ============================================================
      # 10. Restore all NuGet packages
      # ============================================================

      - name: Restore NuGet packages
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          # --------------------------------------------------------
          # SDK-style WpfLib
          # --------------------------------------------------------

          Write-Host ""
          Write-Host "========================================"
          Write-Host "Restoring SDK-style projects"
          Write-Host "========================================"

          & $env:MSBUILD_PATH `
            "WpfLib\WpfLib.csproj" `
            /t:Restore `
            /p:Configuration=Release

          if ($LASTEXITCODE -ne 0) {
            throw "MSBuild restore failed for WpfLib.csproj with exit code $LASTEXITCODE"
          }

          if (-not (Test-Path ".\WpfLib\obj\project.assets.json")) {
            throw "WpfLib restore did not create project.assets.json"
          }

          Write-Host "[OK] WpfLib restore"


          # --------------------------------------------------------
          # DocumentLocator SDK project
          # --------------------------------------------------------

          Write-Host ""
          Write-Host "========================================"
          Write-Host "Restoring DocumentLocator SDK project"
          Write-Host "========================================"

          $documentLocatorProject = `
            "KitveiHakodesh\CSharpBackend\DocumentLocator\DocumentLocator\DocumentLocator.csproj"

          if (-not (Test-Path $documentLocatorProject)) {
            throw "DocumentLocator project not found: $documentLocatorProject"
          }

          & $env:MSBUILD_PATH `
            $documentLocatorProject `
            /t:Restore `
            /p:Configuration=Release `
            /p:Platform=AnyCPU

          if ($LASTEXITCODE -ne 0) {
            throw "MSBuild restore failed for DocumentLocator.csproj with exit code $LASTEXITCODE"
          }

          $documentLocatorAssets = `
            "KitveiHakodesh\CSharpBackend\DocumentLocator\DocumentLocator\obj\project.assets.json"

          if (-not (Test-Path $documentLocatorAssets)) {
            throw "DocumentLocator restore did not create project.assets.json"
          }

          Write-Host "[OK] DocumentLocator SDK project restore"


          # --------------------------------------------------------
          # Legacy packages.config projects
          # --------------------------------------------------------

          Write-Host ""
          Write-Host "========================================"
          Write-Host "Restoring legacy packages.config projects"
          Write-Host "========================================"

          $legacyRestores = @(
            @{
              Config = "KleiKodeshVsto\packages.config"
              Packages = ".\packages"
            },
            @{
              Config = "UpdateCheckerLib\packages.config"
              Packages = ".\packages"
            },
            @{
              Config = "KleiKodeshVsto\WebSitesLib\WebSitesLib\packages.config"
              Packages = ".\KleiKodeshVsto\WebSitesLib\packages"
            },
            @{
              Config = "KleiKodeshVsto\nakdan\Nakdan\packages.config"
              Packages = ".\KleiKodeshVsto\nakdan\packages"
            },
            @{
              Config = "KitveiHakodesh\CSharpBackend\KitveiHakodeshLib\packages.config"
              Packages = ".\KitveiHakodesh\CSharpBackend\packages"
            },
            @{
              Config = "KitveiHakodesh\CSharpBackend\KitveiHakodeshDemoApp\packages.config"
              Packages = ".\KitveiHakodesh\CSharpBackend\packages"
            },
            @{
              Config = "KitveiHakodesh\CSharpBackend\FtsLib-Csharp\FtsLib.Net48\packages.config"
              Packages = ".\KitveiHakodesh\CSharpBackend\FtsLib-Csharp\packages"
            },
            @{
              Config = "KitveiHakodesh\CSharpBackend\FtsLib-Csharp\FtsLibTest\packages.config"
              Packages = ".\KitveiHakodesh\CSharpBackend\FtsLib-Csharp\packages"
            },
            @{
              Config = "KleiKodeshVsto\DocDesign\DocDesignLib\packages.config"
              Packages = ".\KleiKodeshVsto\DocDesign\DocDesignLib\packages"
            },
            @{
              Config = "KleiKodeshVsto\Kiwix\KiwixLib\packages.config"
              Packages = ".\packages"
            },
            @{
              Config = "KleiKodeshVsto\RegexInWord\RegexFindLib\packages.config"
              Packages = ".\KleiKodeshVsto\RegexInWord\RegexFindLib\packages"
            },
            @{
              Config = "KitveiHakodesh\CSharpBackend\DocumentLocator\DocumentLocator\packages.config"
              Packages = ".\KitveiHakodesh\CSharpBackend\DocumentLocator\packages"
            },
            @{
              Config = "KitveiHakodesh\CSharpBackend\DocumentLocator\DocumentLocator.Service\packages.config"
              Packages = ".\KitveiHakodesh\CSharpBackend\DocumentLocator\packages"
            },
            @{
              Config = "KitveiHakodesh\CSharpBackend\DocumentLocator\DocumentLocator.Service\packages.config"
              Packages = ".\packages"
            }
          )

          foreach ($restore in $legacyRestores) {

            Write-Host ""
            Write-Host "----------------------------------------"
            Write-Host "Config:   $($restore.Config)"
            Write-Host "Packages: $($restore.Packages)"
            Write-Host "----------------------------------------"

            if (-not (Test-Path $restore.Config)) {
              throw "packages.config not found: $($restore.Config)"
            }

            New-Item `
              -ItemType Directory `
              -Force `
              -Path $restore.Packages |
              Out-Null

            & nuget.exe restore `
              $restore.Config `
              -PackagesDirectory $restore.Packages `
              -NonInteractive `
              -Verbosity normal

            if ($LASTEXITCODE -ne 0) {
              throw "NuGet restore failed for $($restore.Config) into $($restore.Packages) with exit code $LASTEXITCODE"
            }

            Write-Host "[OK] $($restore.Config) -> $($restore.Packages)"
          }


          # ========================================================
          # FIX:
          # Explicitly install System.ValueTuple 4.5.0
          #
          # DocumentLocator.Service expects this exact legacy DLL:
          #
          # packages\System.ValueTuple.4.5.0\lib\net47\
          #     System.ValueTuple.dll
          #
          # The current packages.config restore does not reliably
          # produce this package, so install it explicitly.
          # ========================================================

          Write-Host ""
          Write-Host "========================================"
          Write-Host "Installing legacy DocumentLocator System.ValueTuple 4.5.0"
          Write-Host "========================================"

          $documentLocatorPackages = `
            ".\KitveiHakodesh\CSharpBackend\DocumentLocator\packages"

          New-Item `
            -ItemType Directory `
            -Force `
            -Path $documentLocatorPackages |
            Out-Null

          & nuget.exe install `
            "System.ValueTuple" `
            -Version "4.5.0" `
            -OutputDirectory $documentLocatorPackages `
            -NonInteractive `
            -Verbosity normal

          if ($LASTEXITCODE -ne 0) {
            throw "Failed to install System.ValueTuple 4.5.0"
          }

          $legacyValueTuple = `
            "$documentLocatorPackages\System.ValueTuple.4.5.0\lib\net47\System.ValueTuple.dll"

          if (-not (Test-Path $legacyValueTuple)) {
            throw "System.ValueTuple 4.5.0 DLL was not installed: $legacyValueTuple"
          }

          Write-Host ""
          Write-Host "[OK] System.ValueTuple 4.5.0"
          Write-Host $legacyValueTuple


          # ========================================================
          # Legacy Unsafe dependency
          # ========================================================

          Write-Host ""
          Write-Host "========================================"
          Write-Host "Installing legacy DocumentLocator dependency"
          Write-Host "========================================"

          & nuget.exe install `
            "System.Runtime.CompilerServices.Unsafe" `
            -Version "4.3.0" `
            -OutputDirectory $documentLocatorPackages `
            -NonInteractive `
            -Verbosity normal

          if ($LASTEXITCODE -ne 0) {
            throw "Failed to install System.Runtime.CompilerServices.Unsafe 4.3.0"
          }

          $legacyUnsafe = `
            "$documentLocatorPackages\System.Runtime.CompilerServices.Unsafe.4.3.0\lib\netstandard1.0\System.Runtime.CompilerServices.Unsafe.dll"

          if (-not (Test-Path $legacyUnsafe)) {
            throw "Legacy Unsafe DLL was not installed: $legacyUnsafe"
          }

          Write-Host "[OK] System.Runtime.CompilerServices.Unsafe 4.3.0"


          # ========================================================
          # Verify required package files
          # ========================================================

          Write-Host ""
          Write-Host "========================================"
          Write-Host "Verifying required package files"
          Write-Host "========================================"

          $requiredFiles = @(

            # ------------------------------------------------------
            # ChromeTabs external dependency
            # ------------------------------------------------------

            ".\ChromeTabs\FluentChromeTabs\FluentChromeTabs.csproj",
            ".\ChromeTabs\FluentChromeTabs\obj\project.assets.json",

            # ------------------------------------------------------
            # Main solution packages
            # ------------------------------------------------------

            ".\packages\System.ValueTuple.4.6.1\build\net471\System.ValueTuple.targets",
            ".\packages\Microsoft.Web.WebView2.1.0.3912.50\build\Microsoft.Web.WebView2.targets",
            ".\packages\Stub.System.Data.SQLite.Core.NetFramework.1.0.119.0\build\net46\Stub.System.Data.SQLite.Core.NetFramework.targets",

            # ------------------------------------------------------
            # WebSitesLib
            # ------------------------------------------------------

            ".\KleiKodeshVsto\WebSitesLib\packages\System.ValueTuple.4.6.1\build\net471\System.ValueTuple.targets",

            # ------------------------------------------------------
            # Nakdan
            # ------------------------------------------------------

            ".\KleiKodeshVsto\nakdan\packages\System.ValueTuple.4.6.2\build\net471\System.ValueTuple.targets",

            # ------------------------------------------------------
            # KitveiHakodesh
            # ------------------------------------------------------

            ".\KitveiHakodesh\CSharpBackend\packages\System.ValueTuple.4.6.1\build\net471\System.ValueTuple.targets",

            ".\KitveiHakodesh\CSharpBackend\FtsLib-Csharp\packages\Stub.System.Data.SQLite.Core.NetFramework.1.0.119.0\build\net46\Stub.System.Data.SQLite.Core.NetFramework.targets",

            # ------------------------------------------------------
            # WpfLib
            # ------------------------------------------------------

            ".\WpfLib\obj\project.assets.json",

            # ------------------------------------------------------
            # DocumentLocator SDK restore
            # ------------------------------------------------------

            ".\KitveiHakodesh\CSharpBackend\DocumentLocator\DocumentLocator\obj\project.assets.json",

            # ------------------------------------------------------
            # DocumentLocator packages
            # ------------------------------------------------------

            ".\KitveiHakodesh\CSharpBackend\DocumentLocator\packages\J2N.2.0.0\lib\net45\J2N.dll",

            ".\KitveiHakodesh\CSharpBackend\DocumentLocator\packages\Lucene.Net.4.8.0-beta00016\lib\net45\Lucene.Net.dll",

            ".\KitveiHakodesh\CSharpBackend\DocumentLocator\packages\Microsoft.Bcl.AsyncInterfaces.10.0.5\lib\net462\Microsoft.Bcl.AsyncInterfaces.dll",

            ".\KitveiHakodesh\CSharpBackend\DocumentLocator\packages\System.Buffers.4.6.1\lib\net462\System.Buffers.dll",

            ".\KitveiHakodesh\CSharpBackend\DocumentLocator\packages\System.Memory.4.6.3\lib\net462\System.Memory.dll",

            ".\KitveiHakodesh\CSharpBackend\DocumentLocator\packages\System.Numerics.Vectors.4.6.1\lib\net462\System.Numerics.Vectors.dll",

            ".\KitveiHakodesh\CSharpBackend\DocumentLocator\packages\System.Runtime.CompilerServices.Unsafe.6.1.2\lib\net462\System.Runtime.CompilerServices.Unsafe.dll",

            ".\KitveiHakodesh\CSharpBackend\DocumentLocator\packages\System.Text.Encodings.Web.10.0.5\lib\net462\System.Text.Encodings.Web.dll",

            ".\KitveiHakodesh\CSharpBackend\DocumentLocator\packages\System.Text.Json.8.0.6\lib\net462\System.Text.Json.dll",

            ".\KitveiHakodesh\CSharpBackend\DocumentLocator\packages\System.Threading.Tasks.Extensions.4.6.3\lib\net462\System.Threading.Tasks.Extensions.dll",

            ".\KitveiHakodesh\CSharpBackend\DocumentLocator\packages\System.ValueTuple.4.6.1\build\net471\System.ValueTuple.targets",

            # ------------------------------------------------------
            # IMPORTANT:
            # Legacy System.ValueTuple 4.5.0 required by the
            # DocumentLocator.Service build.
            # ------------------------------------------------------

            ".\KitveiHakodesh\CSharpBackend\DocumentLocator\packages\System.ValueTuple.4.5.0\lib\net47\System.ValueTuple.dll",

            # ------------------------------------------------------
            # Legacy Unsafe
            # ------------------------------------------------------

            ".\KitveiHakodesh\CSharpBackend\DocumentLocator\packages\System.Runtime.CompilerServices.Unsafe.4.3.0\lib\netstandard1.0\System.Runtime.CompilerServices.Unsafe.dll",

            # ------------------------------------------------------
            # Other DocumentLocator dependencies
            # ------------------------------------------------------

            ".\KitveiHakodesh\CSharpBackend\DocumentLocator\packages\Prism.Core.7.2.0.1422\lib\net45\Prism.dll",

            ".\KitveiHakodesh\CSharpBackend\DocumentLocator\packages\Microsoft.Extensions.Configuration.Abstractions.1.1.2\lib\netstandard1.0\Microsoft.Extensions.Configuration.Abstractions.dll",

            ".\KitveiHakodesh\CSharpBackend\DocumentLocator\packages\Microsoft.Extensions.Primitives.1.1.1\lib\netstandard1.0\Microsoft.Extensions.Primitives.dll",

            # ------------------------------------------------------
            # Main packages - modern dependencies
            # ------------------------------------------------------

            ".\packages\Microsoft.Bcl.AsyncInterfaces.10.0.5\lib\net462\Microsoft.Bcl.AsyncInterfaces.dll",

            ".\packages\System.Buffers.4.6.1\lib\net462\System.Buffers.dll",

            ".\packages\System.IO.Pipelines.10.0.5\lib\net462\System.IO.Pipelines.dll",

            ".\packages\System.Memory.4.6.3\lib\net462\System.Memory.dll",

            ".\packages\System.Numerics.Vectors.4.6.1\lib\net462\System.Numerics.Vectors.dll",

            ".\packages\System.Runtime.CompilerServices.Unsafe.6.1.2\lib\net462\System.Runtime.CompilerServices.Unsafe.dll",

            ".\packages\System.Text.Encodings.Web.10.0.5\lib\net462\System.Text.Encodings.Web.dll",

            ".\packages\System.Text.Json.10.0.5\lib\net462\System.Text.Json.dll",

            ".\packages\System.Threading.Tasks.Extensions.4.6.3\lib\net462\System.Threading.Tasks.Extensions.dll"
          )

          foreach ($file in $requiredFiles) {

            if (-not (Test-Path $file)) {
              throw "Required restored file is missing: $file"
            }

            Write-Host "[OK] $file"
          }

          Write-Host ""
          Write-Host "========================================"
          Write-Host "NuGet restore completed successfully."
          Write-Host "========================================"


      # ============================================================
      # 11. Install vue-frontend npm dependencies
      #
      # KitveiHakodesh.targets runs `npm run build` (vue-tsc) during
      # the MSBuild build, but a fresh runner has no node_modules.
      # Without this step the build fails with:
      #
      #   'vue-tsc' is not recognized as an internal or external command
      # ============================================================
      - name: Install vue-frontend npm dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "========================================"
          Write-Host "Installing vue-frontend npm dependencies"
          Write-Host "========================================"

          $vueProjectDir = ".\KitveiHakodesh\vue-frontend"

          if (-not (Test-Path "$vueProjectDir\package.json")) {
            throw "vue-frontend package.json not found: $vueProjectDir"
          }

          Push-Location $vueProjectDir

          try {
            Write-Host ""
            Write-Host "Node: $(node --version)"
            Write-Host "npm:  $(npm --version)"

            npm ci

            if ($LASTEXITCODE -ne 0) {
              throw "npm ci failed with exit code $LASTEXITCODE"
            }

            if (-not (Test-Path ".\node_modules\vue-tsc")) {
              throw "vue-tsc was not installed by npm ci"
            }

            Write-Host ""
            Write-Host "[OK] vue-frontend npm dependencies installed."
          }
          finally {
            Pop-Location
          }


      # ============================================================
      # 12. Import build signing certificate
      #
      # KleiKodeshVsto.csproj signs its ClickOnce manifests
      # (SignManifests=true) using the certificate identified by
      # ManifestCertificateThumbprint. That certificate (and the
      # gitignored *.pfx key file) exists only on the local build
      # machine, so without this step MSBuild fails with MSB3323:
      #
      #   Unable to find manifest signing certificate in the
      #   certificate store.
      #
      # The certificate + private key are stored in the
      # BUILD_SIGNING_PFX_B64 / BUILD_SIGNING_PFX_PASSWORD
      # repository secrets and are re-imported on every run.
      # ============================================================
      - name: Import build signing certificate
        shell: pwsh
        env:
          PFX_B64: ${{ secrets.BUILD_SIGNING_PFX_B64 }}
          PFX_PASSWORD: ${{ secrets.BUILD_SIGNING_PFX_PASSWORD }}
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "========================================"
          Write-Host "Importing build signing certificate"
          Write-Host "========================================"

          $expectedThumbprint = "9222AB03C319646619DABBAAFA3CC033EEFD42E0"
          $runnerPfx = Join-Path $env:RUNNER_TEMP "KleiKodesh_TemporaryKey.pfx"
          $projectPfx = ".\KleiKodeshVsto\KleiKodesh_TemporaryKey.pfx"

          if ([string]::IsNullOrWhiteSpace($env:PFX_B64)) {
            throw "Secret BUILD_SIGNING_PFX_B64 is empty or missing."
          }

          if ([string]::IsNullOrWhiteSpace($env:PFX_PASSWORD)) {
            throw "Secret BUILD_SIGNING_PFX_PASSWORD is empty or missing."
          }

          [IO.File]::WriteAllBytes($runnerPfx, [Convert]::FromBase64String($env:PFX_B64))

          $securePwd = ConvertTo-SecureString $env:PFX_PASSWORD -AsPlainText -Force

          $imported = Import-PfxCertificate `
            -FilePath $runnerPfx `
            -Password $securePwd `
            -CertStoreLocation "Cert:\CurrentUser\My"

          if ($imported.Thumbprint -ne $expectedThumbprint) {
            throw "Imported certificate thumbprint $($imported.Thumbprint) does not match expected $expectedThumbprint."
          }

          # Also place the key file where the project expects it
          # (ManifestKeyFile=KleiKodesh_TemporaryKey.pfx, gitignored).
          Copy-Item $runnerPfx $projectPfx -Force

          Write-Host ""
          Write-Host "[OK] Certificate imported: $($imported.Subject)"
          Write-Host "[OK] Thumbprint: $($imported.Thumbprint)"
          Write-Host "[OK] Expires: $($imported.NotAfter)"
          Write-Host "[OK] Key file written: $projectPfx"


      # ============================================================
      # 13. Install VSTO Runtime
      #
      # The VSTO build task VerifyClickOnceSigningSettings
      # (Microsoft.VisualStudio.Tools.Office.targets line 162)
      # requires Microsoft.VisualStudio.Tools.Applications.Hosting
      # 10.0.0.0 from the "Visual Studio Tools for Office Runtime",
      # which is not installed on the hosted runner. Without it the
      # build fails with MSB4018 / FileNotFoundException for
      # Microsoft.VisualStudio.Tools.Applications.Hosting.
      #
      # vstor_redist.exe = official Microsoft download of the
      # "Microsoft Visual Studio 2010 Tools for Office Runtime"
      # (fwlink 158917). Silent install; exit code 3010 means
      # success with reboot pending (safe to ignore in CI).
      # ============================================================
      - name: Install VSTO Runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "========================================"
          Write-Host "Installing VSTO Runtime (vstor_redist)"
          Write-Host "========================================"

          $setup = Join-Path $env:RUNNER_TEMP "vstor_redist.exe"
          $url = "https://go.microsoft.com/fwlink/?LinkId=158917"

          Invoke-WebRequest -Uri $url -OutFile $setup -UseBasicParsing

          if (-not (Test-Path $setup)) {
            throw "vstor_redist.exe download failed."
          }

          Write-Host "Downloaded: $((Get-Item $setup).Length) bytes"

          $proc = Start-Process -FilePath $setup -ArgumentList "/q", "/norestart" -Wait -PassThru
          $code = $proc.ExitCode

          if ($code -ne 0 -and $code -ne 3010) {
            throw "vstor_redist.exe failed with exit code $code."
          }

          $gacProbe = @(
            (Join-Path $env:WINDIR "Microsoft.NET\assembly\GAC_MSIL\Microsoft.VisualStudio.Tools.Applications.Hosting"),
            (Join-Path $env:WINDIR "assembly\GAC_MSIL\Microsoft.VisualStudio.Tools.Applications.Hosting")
          )

          $found = $gacProbe | Where-Object { Test-Path $_ } | Select-Object -First 1

          if ($found) {
            Write-Host "[OK] Hosting assembly present in GAC: $found"
          }
          else {
            Write-Warning "Hosting assembly not found in expected GAC paths; continuing."
          }

          Write-Host "[OK] VSTO Runtime installed (exit code $code)."


      # ============================================================
      # 14. Build installer
      # ============================================================

      - name: Build installer
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "========================================"
          Write-Host "Building KleiKodesh installer"
          Write-Host "========================================"

          .\Build\scripts\build-installer.ps1 `
            -ManualVersion $env:UPSTREAM_RELEASE `
            -NoRelease `
            -ReleaseNotesSource commits

          if ($LASTEXITCODE -ne 0) {
            throw "Installer build failed with exit code $LASTEXITCODE"
          }

          Write-Host ""
          Write-Host "[OK] Installer build completed."


      # ============================================================
      # 15. Publish GitHub release
      # ============================================================

      - name: Publish fork release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"

          $version = $env:UPSTREAM_RELEASE
          $releaseDir = "Build/releases"

          Write-Host "========================================"
          Write-Host "Preparing release $version"
          Write-Host "========================================"

          $assets = @(
            "$releaseDir/KleiKodeshSetup-$version.exe",
            "$releaseDir/KleiKodeshSetup-$version-x64.exe",
            "$releaseDir/KleiKodeshSetup-$version-x86.exe",
            "$releaseDir/KitveiHakodeshPortable-$version.zip"
          )

          foreach ($asset in $assets) {

            if (-not (Test-Path $asset)) {
              throw "Missing release asset: $asset"
            }

            Write-Host "[OK] Found asset: $asset"
          }

          Write-Host ""
          Write-Host "Checking whether the fork release already exists for $version..."

          $releaseExists = $false
          $publishedRelease = $null
          try {
            $publishedRelease = Invoke-RestMethod `
              -Uri "https://api.github.com/repos/${{ github.repository }}/releases/tags/$version" `
              -Headers @{
                "User-Agent" = "KleiKodesh-ForkSync"
                "Authorization" = "Bearer $env:GH_TOKEN"
                "Accept" = "application/vnd.github+json"
              }
            $releaseExists = $true
          }
          catch {
            $statusCode = 0
            if ($null -ne $_.Exception.Response) {
              $statusCode = [int]$_.Exception.Response.StatusCode
            }
            if ($statusCode -ne 404) {
              throw "Could not determine whether release $version exists: $($_.Exception.Message)"
            }
          }

          if ($releaseExists) {
            $publishedCommit = git rev-parse --verify --quiet "refs/fork/tags/$version^{commit}"
            if ($LASTEXITCODE -ne 0) {
              throw "Release $version exists, but its fork tag does not resolve to a commit. Refusing to claim it is valid."
            }

            $publishedCommit = $publishedCommit.Trim()
            $publishedGitlink = git ls-tree $publishedCommit -- "KitveiHakodesh/CSharpBackend/DocumentLocator"
            if ($publishedGitlink -notmatch "^160000 commit $env:UPSTREAM_DOCUMENTLOCATOR_SHA\s") {
              throw "Existing release $version points to a tree with a DocumentLocator gitlink different from upstream ($env:UPSTREAM_DOCUMENTLOCATOR_SHA). No changes were made."
            }

            git merge-base --is-ancestor "refs/upstream/tags/$version" $publishedCommit
            if ($LASTEXITCODE -ne 0) {
              throw "Existing release $version does not contain the exact upstream release commit. No changes were made."
            }

            if ($publishedRelease.tag_name -ne $version -or $publishedRelease.draft -or $publishedRelease.prerelease) {
              throw "Existing release $version is not a published stable release for that exact tag."
            }

            Write-Host "Existing release $version is verified at commit $publishedCommit. Nothing to do."
            exit 0
          }

          Write-Host "No existing GitHub release found. Publishing the verified build..."

          $syncCommit = (git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($syncCommit)) {
            throw "Could not resolve the synchronized build commit."
          }

          $existingForkTag = git rev-parse --verify --quiet "refs/fork/tags/$version^{commit}" 2>$null
          $tagAlreadyExists = $LASTEXITCODE -eq 0
          if ($tagAlreadyExists) {
            $releaseTargetCommit = $existingForkTag.Trim()
            $existingTagTree = (git rev-parse "$releaseTargetCommit^{tree}").Trim()
            $syncTree = (git rev-parse "${syncCommit}^{tree}").Trim()
            if ($LASTEXITCODE -ne 0 -or $existingTagTree -ne $syncTree) {
              throw "Existing tag $version does not point to the exact synchronized tree that was built. Refusing to push master or move the tag."
            }
          }
          else {
            $releaseTargetCommit = $syncCommit
          }

          git push origin HEAD:master

          if ($LASTEXITCODE -ne 0) {
            throw "Fast-forward push of synchronized commit $syncCommit to origin/master failed. No force push will be attempted."
          }

          $pushedMaster = git ls-remote origin refs/heads/master
          if ($LASTEXITCODE -ne 0 -or $pushedMaster -notmatch "^$syncCommit\s+refs/heads/master$") {
            throw "origin/master does not resolve to synchronized commit $syncCommit after push."
          }

          if (-not $tagAlreadyExists) {
            git tag -a $version $releaseTargetCommit -m "KleiKodesh $version"
            if ($LASTEXITCODE -ne 0) {
              throw "Failed to create release tag $version at $syncCommit."
            }

            git push origin "refs/tags/$version"

            if ($LASTEXITCODE -ne 0) {
              throw "Failed to push release tag $version. Existing tags will not be deleted or rewritten."
            }
          }

          gh release create `
            $version `
            $assets `
            --repo "${{ github.repository }}" `
            --title "KleiKodesh $version" `
            --generate-notes `
            --target $releaseTargetCommit

          if ($LASTEXITCODE -ne 0) {
            throw "Failed to create GitHub release $version"
          }

          $publishedTag = git ls-remote --tags origin "refs/tags/$version" "refs/tags/$version^{}"
          if ($LASTEXITCODE -ne 0) {
            throw "Could not verify published tag $version on origin."
          }

          $peeledTag = $publishedTag | Where-Object { $_ -match "\srefs/tags/$([regex]::Escape($version))\^\{\}$" } | Select-Object -First 1
          if ($peeledTag) {
            $publishedTagCommit = ($peeledTag -split '\s+')[0]
          }
          else {
            $publishedTagCommit = ($publishedTag | Select-Object -First 1) -split '\s+' | Select-Object -First 1
          }

          if ($publishedTagCommit -ne $releaseTargetCommit) {
            throw "Published tag $version resolves to $publishedTagCommit instead of verified release target $releaseTargetCommit."
          }

          $publishedRelease = Invoke-RestMethod `
            -Uri "https://api.github.com/repos/${{ github.repository }}/releases/tags/$version" `
            -Headers @{
              "User-Agent" = "KleiKodesh-ForkSync"
              "Authorization" = "Bearer $env:GH_TOKEN"
              "Accept" = "application/vnd.github+json"
            }

          if ($publishedRelease.tag_name -ne $version -or $publishedRelease.draft -or $publishedRelease.prerelease) {
            throw "Published release verification failed for $version."
          }

          $publishedAssetNames = @($publishedRelease.assets | ForEach-Object { $_.name })
          foreach ($asset in $assets) {
            $expectedAssetName = [IO.Path]::GetFileName($asset)
            if ($expectedAssetName -notin $publishedAssetNames) {
              throw "Published release $version is missing asset $expectedAssetName."
            }
          }

          Write-Host ""
          Write-Host "========================================"
          Write-Host "Release $version verified at synchronized commit $syncCommit."
          Write-Host "========================================"
