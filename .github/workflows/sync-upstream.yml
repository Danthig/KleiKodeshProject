name: Sync upstream and publish fork release

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: write

concurrency:
  group: sync-upstream-release
  cancel-in-progress: false

jobs:
  sync-build-release:
    runs-on: windows-latest
    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Configure upstream remote
        shell: pwsh
        run: |
          git remote add upstream https://github.com/KleiKodesh/KleiKodeshProject.git
          $release = Invoke-RestMethod -Uri "https://api.github.com/repos/KleiKodesh/KleiKodeshProject/releases/latest" -Headers @{ "User-Agent" = "KleiKodesh-ForkSync" }
          if ($release.tag_name -notmatch '^v\d+\.\d+\.\d+$') { throw "Invalid upstream release tag: $($release.tag_name)" }
          "UPSTREAM_RELEASE=$($release.tag_name)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8
          git fetch upstream "refs/tags/$($release.tag_name):refs/tags/upstream-release"

      - name: Merge upstream changes
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git merge --no-edit upstream-release
          if ($LASTEXITCODE -ne 0) {
            git merge --abort
            Write-Host "Merge conflict detected. The release will not be built." -ForegroundColor Red
            exit 1
          }
          git push origin HEAD:master

      - name: Initialize submodules (latest remote HEAD)
        shell: pwsh
        run: |
          # One or more submodule pointers in this repo's history can reference a
          # commit that was never pushed to the submodule's own remote (upload-pack:
          # "not our ref"). A plain `git submodule update --init --recursive` fails
          # hard on that exact commit, so `--remote` is used instead: it ignores the
          # pinned SHA and checks out each submodule's tracked branch HEAD instead.
          # Runs after the merge so submodules are initialized against the final,
          # post-merge tree rather than the pre-merge one.
          git submodule sync --recursive
          git submodule update --init --recursive --remote
          if ($LASTEXITCODE -ne 0) {
            throw "git submodule update failed with exit code $LASTEXITCODE"
          }

      - name: Install NSIS
        shell: pwsh
        run: |
          choco install nsis -y --no-progress

      - name: Locate MSBuild
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path $vswhere)) {
            throw "vswhere.exe was not found at: $vswhere"
          }
          Write-Host "Searching for MSBuild with vswhere..."
          $msbuild = & $vswhere `
            -latest `
            -products * `
            -requires Microsoft.Component.MSBuild `
            -find "MSBuild\**\Bin\MSBuild.exe" |
            Select-Object -First 1
          if (-not $msbuild) {
            throw "MSBuild.exe was not found by vswhere."
          }
          $msbuild = $msbuild.Trim()
          if (-not (Test-Path $msbuild)) {
            throw "vswhere returned an invalid MSBuild path: $msbuild"
          }
          Write-Host "MSBuild found:"
          Write-Host $msbuild
          "MSBUILD_PATH=$msbuild" | Out-File `
            -FilePath $env:GITHUB_ENV `
            -Encoding utf8 `
            -Append

      - name: Restore NuGet packages
        shell: pwsh
        run: |
          # Restoring the whole .slnx pulls in every project listed there, including
          # ones unrelated to the installer build (e.g. ChromeTabs/FluentChromeTabs,
          # which is missing from the checked-out tree entirely -- an upstream repo
          # issue, not something restore can work around). build-installer.ps1 only
          # ever builds KleiKodeshVsto.csproj (via KleiKodeshVstoInstallerWpf.csproj's
          # own BuildVstoAndPack target), so only those two are restored here.
          #
          # KleiKodeshVsto.csproj uses the legacy packages.config format, not
          # PackageReference. `msbuild /t:restore` only restores PackageReference
          # projects unless RestorePackagesConfig=true is passed explicitly -- without
          # it, restore silently no-ops for this project and the build fails later
          # with "missing NuGet package(s)" (e.g. System.ValueTuple).
          $projects = @(
            "KleiKodeshVsto\KleiKodeshVsto.csproj",
            "Build\Installer\KleiKodeshVstoInstallerWpf.csproj"
          )
          foreach ($project in $projects) {
            Write-Host "Restoring $project ..."
            & $env:MSBUILD_PATH $project /t:restore /p:Configuration=Release /p:RestorePackagesConfig=true
            if ($LASTEXITCODE -ne 0) {
              throw "MSBuild restore failed for $project with exit code $LASTEXITCODE"
            }
          }

      - name: Build installer
        shell: pwsh
        run: |
          .\Build\scripts\build-installer.ps1 `
            -ManualVersion $env:UPSTREAM_RELEASE `
            -NoRelease `
            -ReleaseNotesSource commits

      - name: Publish fork release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = $env:UPSTREAM_RELEASE
          $releaseDir = "Build/releases"
          $assets = @(
            "$releaseDir/KleiKodeshSetup-$version.exe",
            "$releaseDir/KleiKodeshSetup-$version-x64.exe",
            "$releaseDir/KleiKodeshSetup-$version-x86.exe",
            "$releaseDir/KitveiHakodeshPortable-$version.zip"
          )
          foreach ($asset in $assets) {
            if (-not (Test-Path $asset)) {
              throw "Missing release asset: $asset"
            }
          }

          $existing = gh release view $version --repo "${{ github.repository }}" 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release delete $version `
              --repo "${{ github.repository }}" `
              --yes `
              --cleanup-tag
          }

          gh release create $version `
            $assets `
            --repo "${{ github.repository }}" `
            --title "KleiKodesh $version" `
            --generate-notes `
            --target master
